<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><title>vstupenky.online - katalog WordPress</title>
<style>
@font-face{font-family:Brand;src:url('../../../assets/brand/vstupenky-online/source/Roboto-Bold.ttf');font-weight:700;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#19243b;color:#fff;font-family:Brand,sans-serif}#art{width:1600px;height:1100px;position:absolute;transform-origin:top left;background:#19243b}.brand{position:absolute;left:64px;top:48px;width:330px;height:auto}.copy{position:absolute;left:64px;top:300px;width:580px}h1{font-size:68px;line-height:1.08;letter-spacing:-.025em;margin:0 0 32px;text-wrap:balance}p{font-size:29px;line-height:1.5;color:#c8e4fc;margin:0;max-width:30ch}.foot{position:absolute;left:64px;bottom:44px;color:#c8e4fc;font-size:19px}.capture{position:absolute;display:block;object-fit:contain;background:#fff;border-radius:12px}.onboard{left:860px;top:56px;width:640px;height:970px}.editor{left:710px;top:150px;width:826px;height:791px}.desktop{left:740px;top:56px;width:796px;height:994px}.mobile-a,.mobile-b{top:54px;width:378px;height:972px}.mobile-a{left:736px;height:942px}.mobile-b{left:1150px}.seats{left:740px;top:56px;width:796px;height:994px;object-fit:contain}.wide .copy{top:147px;left:64px;width:1460px;display:flex;align-items:start;gap:70px}.wide h1{font-size:51px;width:780px;margin:0}.wide p{font-size:26px;width:540px}.wide .brand{width:290px;top:28px}.wide .foot{display:none}.banner #art{width:1544px;height:500px}.banner .brand{left:432px;top:48px;width:680px}.banner .copy{left:100px;top:257px;width:1344px;text-align:center}.banner h1{font-size:58px;margin:0 0 23px}.banner p{font-size:29px;max-width:none}.banner .foot{display:none}.icon #art{width:256px;height:256px}.icon .brand{left:0;top:0;width:256px;height:256px}.icon .copy,.icon .foot{display:none}
</style></head><body><main id="art"><img class="brand" src="../../../assets/brand/vstupenky-online/vstupenky-online-header-dark.svg" alt="vstupenky.online"><div class="copy"><h1></h1><p></p></div><div class="foot">Skutečné rozhraní · Ukázková data</div></main>
<script>
const q=new URLSearchParams(location.search);
if(q.get('product')==='festapp-tickets')location.replace('festapp-tickets/artwork.html'+location.search);
const kind=q.get('kind')||'banner',art=document.getElementById('art');document.body.className=kind;
const shots={
1:['Začněte ve WordPressu','Připravte formulář, vložte blok a zveřejněte stránku.',['cs-onboarding-cards.png','onboard']],
2:['Formulář jako běžný blok','URL, výška i převzetí vzhledu webu přímo v editoru.',['cs-editor-crop.png','editor']],
3:['Prodej přímo ve stránce','Vaše akce a objednávkový formulář na jednom místě.',['cs-desktop-crop.png','desktop']],
4:['I na malém displeji','Dva formuláře na jedné stránce. Skutečný náhled v mobilním Chromu.',['cs-mobile-top-crop.png','mobile-a'],['cs-mobile-second.png','mobile-b']],
5:['Výběr míst přímo ve formuláři','Návštěvník si vybere místo v plánku sálu.',['cs-seats-crop.png','seats']]};
if(kind==='icon'){document.querySelector('.brand').src='../../../assets/brand/vstupenky-online/vstupenky-online-icon-dark.svg'}
else if(kind==='shot'){const s=shots[q.get('shot')]||shots[1];document.querySelector('h1').textContent=s[0];document.querySelector('p').textContent=s[1];for(const [src,cls] of s.slice(2)){const img=document.createElement('img');img.src='source/'+src;img.className='capture '+cls;img.alt=s[0];art.append(img)}}
else{document.querySelector('h1').textContent='Vstupenky na Vašem webu';document.querySelector('p').textContent='Nativní blok a shortcode pro WordPress'}
function resize(){const w=kind==='banner'?1544:kind==='icon'?256:1600,h=kind==='banner'?500:kind==='icon'?256:1100;art.style.transform='scale('+Math.min(innerWidth/w,innerHeight/h)+')'}resize();addEventListener('resize',resize);
</script></body></html>
