    <script>
        // Check for redirect query param (Clean URL Logic)
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');
        if (redirect) {
            // Immediately restore the original path
            // This hides 'flutter.html' and tells Flutter to load this route
            console.log('Restoring clean URL via redirect param:', redirect);
            window.history.replaceState(null, '', redirect);
        }

        if (window.location.hash) {
          var hash = window.location.hash;

          // Only run if the hash looks like a Flutter Route ("#/")
          if (hash.startsWith('#/')) {

            // Remove the '#' symbol (substring(1) drops the first character)
            // "#/events" becomes "/events"
            var newPath = hash.substring(1);

            // Replace the current history state
            window.history.replaceState(null, null, newPath);
          }
        }

    window.OneSignalDeferred = window.OneSignalDeferred || [];

   let oneSignalSdkPromise;
   function loadOneSignalSdk() {
       if (window.OneSignal) return Promise.resolve();
       if (oneSignalSdkPromise) return oneSignalSdkPromise;
       oneSignalSdkPromise = new Promise(function(resolve, reject) {
           const script = document.createElement('script');
           script.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
           script.async = true;
           script.onload = resolve;
           script.onerror = function() {
             oneSignalSdkPromise = null;
             reject(new Error('OneSignal SDK could not be loaded'));
           };
           document.head.appendChild(script);
       });
       return oneSignalSdkPromise;
   }

   async function initializeOneSignal(callback, errorCallback) {
       if (!window.OneSignalInitialized) {
           window.OneSignalInitialized = true;
           OneSignalDeferred.push(async function(OneSignal) {
               try {
                 await OneSignal.init({
                       appId: "73f77f22-961a-4ded-9647-e33a7ac14f90",
                       safari_web_id: "web.onesignal.auto.34cabfa2-ddd9-46d0-b8b2-6fad793020e0",
                       allowLocalhostAsSecureOrigin: true,
                       persistNotification: false,
                       welcomeNotification: {
                         title: "Notifikace",
                         message: "Děkujeme za povolení notifikací.",
                       },
                       serviceWorkerParam: { scope: "/push/" },
                       serviceWorkerPath: "./push/OneSignalSDKWorker.js",
                   });

                   OneSignal.Notifications.addEventListener('foregroundWillDisplay', function(event) {
                       console.log("Received notification: ", event.notification.title, event.notification.body);
                   });
               } catch (error) {
                 console.log("OneSignal initialization failed:", error);
                 window.OneSignalInitialized = false;
                 if (errorCallback) errorCallback(error);
                 return;
               }

               if (callback) callback(null);
           });
           try {
             await loadOneSignalSdk();
           } catch (error) {
             window.OneSignalInitialized = false;
             if (errorCallback) errorCallback(error);
             throw error;
           }
       }
   }

   async function requestNotificationPermission(callback, errorCallback) {
       try {
           await OneSignal.Notifications.requestPermission()
           console.log("Notification permission request sent.");
           if (callback) callback(getNotificationPermission());
       } catch (error) {
           console.error("Notification permission request failed:", error);
           if (errorCallback) errorCallback(error);
       }
   }

   async function logout(callback, errorCallback) {
       OneSignalDeferred.push(async function(OneSignal) {
           try {
             await OneSignal.logout();
             if (callback) callback(null);
           } catch (error) {
             if (errorCallback) errorCallback(error);
           }
       });
   }

       OneSignalDeferred.push(async function(OneSignal) {
           try {
             await OneSignal.login(externalId);
             if (callback) callback(null);
           } catch (error) {
             if (errorCallback) errorCallback(error);
           }
       });

       OneSignalDeferred.push(async function(OneSignal) {

               app_generation: '',
               occasion: ''
             });
             if (callback) callback(null);
           } catch (error) {
             if (errorCallback) errorCallback(error);
           }
       });
   }

   function getNotificationPermission() {
    // Check if the Notification API is supported
    if (!("Notification" in window)) {
      console.error("This browser does not support desktop notifications.");
      return false;
    }

    // Check if the site is served over HTTPS or is running on localhost
    if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
      console.error("Notifications require a secure context (HTTPS).");
      return false;
    }

    // Return the permission status
    return OneSignal.Notifications.permission;
  }

           console.error("Opt-out of notifications failed:", error);

<script>
  // Disable swipe back gesture globally
  document.body.style.overscrollBehaviorX = "none";
  document.body.style.overscrollBehaviorY = "none";

  let deferredPrompt;

  window.addEventListener('beforeinstallprompt', (e) => {
    // Retain the browser event for Festapp's explicit install button.
    e.preventDefault();
    deferredPrompt = e;
    if (typeof hasPrompt === 'function') hasPrompt();
  });

  function promptInstall(){
     if (!deferredPrompt) return;
     // Open synchronously from the click. Waiting here can consume the browser's
     // transient user activation and make the prompt silently fail on Android.
     deferredPrompt.prompt();
  }

  // Listen for app install event
  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    appInstalled();
  });

  // Track how PWA was launched (either from browser or as PWA)
  function getLaunchMode() {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
    if(deferredPrompt) hasPrompt();
    if (document.referrer.startsWith('android-app://')) {
      appLaunchedAsTWA();
    } else if (navigator.standalone || isStandalone) {
      appLaunchedAsPWA();
    } else {
      window.appLaunchedInBrowser();
    }
  }

    position: absolute;

  /* HTML: <div class="loader"></div> */
  .loader {
    height: 50px;
    width: 50px;
    aspect-ratio: 1;
    display: grid;
    border: 4px solid #0000;
    border-radius: 50%;
    border-color: #ccc #0000;
    animation: l16 1s infinite linear;
  }
  .loader::before,
  .loader::after {
    content: "";
    grid-area: 1/1;
    margin: 2px;
    border: inherit;
    border-radius: 50%;
  }
  .loader::before {
    border-color: #fd6206 #0000;
    animation: inherit;
    animation-duration: .5s;
    animation-direction: reverse;
  }
  .loader::after {
    margin: 8px;
  }
  @keyframes l16 {
    100%{transform: rotate(1turn)}
  }
