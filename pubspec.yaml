flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  fonts:
    - family: Futura
      fonts:
        - asset: fonts/Futura PT Book.ttf
          weight: 400
        - asset: fonts/Futura PT Medium.ttf
          weight: 500
        - asset: fonts/Gill Sans Bold.otf
          weight: 700
  assets:
    - assets/email_templates/preview_examples.json
    - supabase/functions/_shared/ticket-assets/
    - supabase/functions/_shared/ticket-assets/backgrounds/
    - supabase/functions/_shared/ticket-assets/gallery-fonts/
    - assets/icons/
    - assets/translations/
    - packages/timezone/data/latest_all.tzf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

