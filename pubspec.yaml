name: fstapp
description: Guide for the event/festival/conference.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.19.94+466

environment:
  sdk: '>=3.0.0 <3.32.8'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter_web_plugins:
    sdk: flutter
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.3
  fluttertoast: 9.0.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  maplibre: 0.3.6
  crypto: ^3.0.6
  convert: ^3.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_marker_popup: ^7.0.0
#  flutter_map_marker_popup:
#    path: ./pckgs/flutter_map_marker_popup-master
  supabase_flutter: ^2.12.0
  flutter_secure_storage: ^10.0.0
  timelines_plus: ^1.0.8
  intl: ^0.20.2
  badges: ^3.1.1
  collection: ^1.18.0
  flutter_map_location_marker: ^9.1.1
  geolocator: ^13.0.4
  flutter_widget_from_html: ^0.17.1
  quill_html_editor:
    git:
      url: https://github.com/the-airbender/quill_html_editor.git
      ref: a2beeb5bfd436e86f2635c8db1154b4190eeedb5
  flutter_quill: ^11.5.1
  vsc_quill_delta_to_html: ^1.0.5
  trina_grid: ^2.1.1
  # trina_grid's select-column popup requires a ShadTheme ancestor; we wrap
  # our grids in one (see single_table_data_grid.dart).
  shadcn_ui: ^0.43.0
  url_strategy: ^0.3.0
  desktop_drop: ^0.7.0
  csv: ^6.0.0
  sembast: ^3.8.6
  sembast_web: ^2.4.4
  path_provider: ^2.1.5
  select_dialog: ^2.0.1
  onesignal_flutter: ^5.3.5
  package_info_plus: ^9.0.0
  flutter_animate: ^4.5.2
  easy_localization: ^3.0.8
  flutter_map_cancellable_tile_provider: ^3.0.2
  simple_shadow: ^0.3.1
  pwa_install:
    git:
      url: https://github.com/jtmuller5/pwa_install.git
      ref: 82320a219574c1b5ddf1d83e080cad5a84261c2d
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.3.0
  qr_flutter: ^4.1.0
  screenshot: ^3.0.0
  mobile_scanner: ^7.1.4
  flutter_map_animations: ^0.8.0
  auto_route: ^11.1.0
  adaptive_theme: 3.7.2
  connectivity_plus: ^7.0.0
  vector_map_tiles_mbtiles: ^1.2.0
  vector_map_tiles: ^8.0.0
  mbtiles: ^0.4.0
  sqlite3_flutter_libs: ^0.5.32
  file_saver: ^0.3.1
  youtube_player_flutter: ^10.0.1
  flutter_widget_from_html_core: ^0.17.0
  fwfh_cached_network_image: ^0.16.1
  multi_split_view: ^3.6.1
  timezone: ^0.10.1
  flutter_colorpicker: ^1.1.0
  google_fonts: ^8.0.1
  file_picker: ^8.1.7
  venue_seat_picker: ^0.1.1

  cached_network_image: any
  cached_network_image_platform_interface: any
  image: any
  cross_file: any
  flutter_cache_manager: any
  url_launcher: any
  html: any
  http: any
  vector_tile_renderer: any
  uuid: any
  web: any
  path: any
  timeago: ^3.7.1
dev_dependencies:
  auto_route_generator: ^10.3.0
  build_runner: ^2.11.0
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# Local MapLibre adapters preserve style-image pixel ratios across Android and
# iOS. The iOS copy also exposes the plugin class during a clean Release build.
# Each package documents its removal condition in FESTAPP_PATCH.md.
dependency_overrides:
  # The Quill editor fork still declares Android WebView 3.x, but only uses
  # APIs retained by 4.x. Keep one WebView implementation for the current
  # YouTube player until the editor updates its dependency constraint.
  webview_flutter_android: ^4.12.0
  maplibre_android:
    path: packages/maplibre_android
  maplibre_ios:
    path: packages/maplibre_ios
  maplibre_platform_interface:
    path: packages/maplibre_platform_interface

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  fonts:
    - family: Gill Sans
      fonts:
        - asset: fonts/Futura PT Book.ttf
          weight: 400
        - asset: fonts/Futura PT Medium.ttf
          weight: 500
        - asset: fonts/Gill Sans Bold.otf
          weight: 700
  assets:
    - assets/icons/
    - assets/translations/
    - packages/timezone/data/latest.tzf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
