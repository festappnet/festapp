    Passkeys Web SDK shim. supabase_flutter pulls passkeys_web, whose
    registerWith() calls PasskeyAuthenticator.init() at startup and throws when
    the real SDK (bundle.js) is absent — aborting main() before runApp(). This
    no-op stub installs only when the real SDK is missing (|| guard).
  -->
  <script>

      init: function () {},
      isConditionalMediationAvailable: function () { return Promise.resolve(false); }
    };

    <script>
        // Check for redirect query param (Clean URL Logic)
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');
        if (redirect) {
            // Immediately restore the original path
            // This hides 'flutter.html' and tells Flutter to load this route
            console.log('Restoring clean URL via redirect param:', redirect);
            window.history.replaceState(null, '', redirect);
        }

        if (window.location.hash) {
          var hash = window.location.hash;

          // Only run if the hash looks like a Flutter Route ("#/")
          if (hash.startsWith('#/')) {

            // Remove the '#' symbol (substring(1) drops the first character)
            // "#/events" becomes "/events"
            var newPath = hash.substring(1);

            // Replace the current history state
            window.history.replaceState(null, null, newPath);
          }
        }
    </script>

  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    const oneSignalWebAppId = "";

   let oneSignalSdkPromise;
   function loadOneSignalSdk() {
       if (window.OneSignal) return Promise.resolve();
       if (oneSignalSdkPromise) return oneSignalSdkPromise;
       oneSignalSdkPromise = new Promise(function(resolve, reject) {
           const script = document.createElement('script');
           script.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
           script.async = true;
           script.onload = resolve;
           script.onerror = function() {
             oneSignalSdkPromise = null;
             reject(new Error('OneSignal SDK could not be loaded'));
           };
           document.head.appendChild(script);
       });
       return oneSignalSdkPromise;
   }

   async function initializeOneSignal(callback, errorCallback) {
       if (!oneSignalWebAppId) {
           if (callback) callback(null);
           return;
       }
       if (!window.OneSignalInitialized) {
           window.OneSignalInitialized = true;
           OneSignalDeferred.push(async function(OneSignal) {
               try {
                 await OneSignal.init({
                       appId: oneSignalWebAppId,
                       safari_web_id: "",
                       allowLocalhostAsSecureOrigin: true,
                       persistNotification: false,
                       welcomeNotification: {
                         title: "Notifikace",
                         message: "Děkujeme za povolení notifikací.",
                       },
                       serviceWorkerParam: { scope: "/push/" },
                       serviceWorkerPath: "./push/OneSignalSDKWorker.js",
                   });

                   OneSignal.Notifications.addEventListener('foregroundWillDisplay', function(event) {
                       console.log("Received notification: ", event.notification.title, event.notification.body);
                   });
               } catch (error) {
                 console.log("OneSignal initialization failed:", error);
                 window.OneSignalInitialized = false;
                 if (errorCallback) errorCallback(error);
                 return;
               }

               if (callback) callback(null);
           });
           try {
             await loadOneSignalSdk();
           } catch (error) {
             window.OneSignalInitialized = false;
             if (errorCallback) errorCallback(error);
             throw error;
           }
       }
   }

   async function requestNotificationPermission(callback, errorCallback) {
       if (!oneSignalWebAppId) {
           if (callback) callback(false);
           return;
       }
       try {
           await OneSignal.Notifications.requestPermission()
           console.log("Notification permission request sent.");
           if (callback) callback(getNotificationPermission());
       } catch (error) {
           console.error("Notification permission request failed:", error);
           if (errorCallback) errorCallback(error);
       }
   }

   async function logout(callback, errorCallback) {
       if (!oneSignalWebAppId) {
           if (callback) callback(null);
           return;
       }
       OneSignalDeferred.push(async function(OneSignal) {
           try {
             await OneSignal.logout();
             if (callback) callback(null);
           } catch (error) {
             if (errorCallback) errorCallback(error);
           }
       });
   }

   async function login(externalId, callback, errorCallback) {
       if (!oneSignalWebAppId) {
           if (callback) callback(null);
           return;
       }
       OneSignalDeferred.push(async function(OneSignal) {
           try {
             await OneSignal.login(externalId);
             if (callback) callback(null);
           } catch (error) {
             if (errorCallback) errorCallback(error);
           }
       });
   }

   async function tagCurrentSubscription(callback, errorCallback) {
       if (!oneSignalWebAppId) {
           if (callback) callback(null);
           return;
       }
       OneSignalDeferred.push(async function(OneSignal) {
           try {
             await OneSignal.User.addTags({
               app_generation: 'farnostopava_no_push_v1',
               occasion: ''
             });
             if (callback) callback(null);
           } catch (error) {
             if (errorCallback) errorCallback(error);
           }
       });
   }

   function getNotificationPermission() {
    if (!oneSignalWebAppId) return false;

    // Check if the Notification API is supported
    if (!("Notification" in window)) {
      console.error("This browser does not support desktop notifications.");
      return false;
    }

    // Check if the site is served over HTTPS or is running on localhost
    if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
      console.error("Notifications require a secure context (HTTPS).");
      return false;
    }

    // Return the permission status
    return OneSignal.Notifications.permission;
  }

   async function optIn(callback, errorCallback) {
       if (!oneSignalWebAppId) {
           if (callback) callback(null);
           return;
       }
       try {
           await OneSignal.User.PushSubscription.optIn();
           console.log("User has opted in for notifications.");
       } catch (error) {
           console.error("Opt-in for notifications failed:", error);
       }
       if (callback) callback(null);
   }

   async function optOut(callback, errorCallback) {
       if (!oneSignalWebAppId) {
           if (callback) callback(null);
           return;
       }
       try {
           await OneSignal.User.PushSubscription.optOut();
           console.log("User has opted out of notifications.");
       } catch (error) {
           console.error("Opt-out of notifications failed:", error);
       }
       if (callback) callback(null);
   }
  </script>

  <!--
    Automatic update prompt. The build stamps the deployed version into
    window.__FESTAPP_BUILD_VERSION__ (via automation/configure_version.js) and
    emits /festapp-version.json (via automation/cloudflare_build.sh). The
    festapp_update_prompt.js script polls that file and offers a reload banner
    when a newer build is live, AND performs a "deep refresh" on load: if a
    stale pre-PWA Flutter service worker / cache is evicted once. Current builds
    use festapp_service_worker.js, which keeps a complete versioned app shell for
    atomic updates and offline cold starts.
  -->
  <script>
    window.__FESTAPP_BUILD_VERSION__ = "0.19.95+475";
    window.__FESTAPP_LOCAL_DEVELOPMENT__ =
      ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);
  </script>

<script>
  // Disable swipe back gesture globally
  document.body.style.overscrollBehaviorX = "none";
  document.body.style.overscrollBehaviorY = "none";

  let deferredPrompt;

  window.addEventListener('beforeinstallprompt', (e) => {
    // Retain the browser event for Festapp's explicit install button.
    e.preventDefault();
    deferredPrompt = e;
    if (typeof hasPrompt === 'function') hasPrompt();
  });

  function promptInstall(){
     if (!deferredPrompt) return;
     // Open synchronously from the click. Waiting here can consume the browser's
     // transient user activation and make the prompt silently fail on Android.
     deferredPrompt.prompt();
  }

  // Listen for app install event
  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    appInstalled();
  });

  // Track how PWA was launched (either from browser or as PWA)
  function getLaunchMode() {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
    if(deferredPrompt) hasPrompt();
    if (document.referrer.startsWith('android-app://')) {
      appLaunchedAsTWA();
    } else if (navigator.standalone || isStandalone) {
      appLaunchedAsPWA();
    } else {
      window.appLaunchedInBrowser();
    }
  }
</script>

<script>
  async function persistUsedFontResources() {
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) {
      await new Promise(function(resolve) {
        navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
      });
    }
    if (document.readyState !== 'complete') {
      await new Promise(function(resolve) {
        window.addEventListener('load', resolve, { once: true });
      });
    }
    const fontUrls = performance.getEntriesByType('resource')
      .map(function(entry) { return entry.name; })
      .filter(function(resourceUrl) {
        const origin = new URL(resourceUrl).origin;
        return origin === 'https://fonts.googleapis.com' ||
          origin === 'https://fonts.gstatic.com';
      });
    await Promise.allSettled([...new Set(fontUrls)].map(function(resourceUrl) {
      // Re-fetch through the now-active worker. This also persists Flutter's
      // demand-loaded Noto Color Emoji shards, but no unused font catalog.
      return fetch(resourceUrl, { mode: 'cors', cache: 'force-cache' });
    }));
  }

  // Development-only boundary. Production cannot enter because the build-time
  // hostname guard above accepts only loopback hosts.
  async function prepareFestappLocalDevelopment() {
    if (!('serviceWorker' in navigator)) return;

    const resetKey = 'festappLocalDevelopmentServiceWorkerReset';
    const hadAppShellController =
      navigator.serviceWorker.controller?.scriptURL.includes('festapp_service_worker.js') ||
      navigator.serviceWorker.controller?.scriptURL.includes('flutter_service_worker.js');
    const registrations = await navigator.serviceWorker.getRegistrations();
    await Promise.all(registrations
      .filter(function(registration) {
        const scriptUrl = registration.active?.scriptURL ||
          registration.waiting?.scriptURL ||
          registration.installing?.scriptURL ||
          '';
        return scriptUrl.includes('festapp_service_worker.js') ||
          scriptUrl.includes('flutter_service_worker.js');
      })
      .map(function(registration) { return registration.unregister(); }));

    if ('caches' in window) {
      const cacheNames = await caches.keys();
      await Promise.all(cacheNames
        .filter(function(cacheName) {
          return cacheName.startsWith('festapp-app-shell-') ||
            cacheName.startsWith('flutter-app-cache');
        })
        .map(function(cacheName) { return caches.delete(cacheName); }));
    }

    // An unregistered worker keeps controlling the current page until the next
    // navigation. Reload once so debug assets can no longer come from its old
    // production cache.
    if (hadAppShellController && sessionStorage.getItem(resetKey) !== '1') {
      sessionStorage.setItem(resetKey, '1');
      window.location.reload();
      return new Promise(function() {});
    }
    sessionStorage.removeItem(resetKey);
  }

  // Production builds install the offline shell. Local Flutter development
  // instead removes stale production workers before booting the debug bundle.
  if (window.__FESTAPP_LOCAL_DEVELOPMENT__) {
    window.festappLocalDevelopmentReady =
      prepareFestappLocalDevelopment().catch(function(error) {
        console.warn('Festapp localhost service worker cleanup failed:', error);
      });
  } else if ('serviceWorker' in navigator) {
    window.festappOfflineReady = navigator.serviceWorker.register('/festapp_service_worker.js', {
      scope: '/',
      updateViaCache: 'none'
    }).then(persistUsedFontResources).catch(function(error) {
      console.warn('Festapp offline service worker registration failed:', error);
    });
  }
</script>

<script>
  // The Flutter engine starting is not enough to call the application ready:
  // Dart can still be restoring the offline context or loading the occasion.
  // FestappBootstrap calls this only after the first usable app frame.
  window.markFestappAppReady = function() {
    if (window.__FESTAPP_APP_READY__ === true) return;
    window.__FESTAPP_APP_READY__ = true;
    window.dispatchEvent(new Event('festapp-app-ready'));
  };

  window.addEventListener('load', async function(ev) {
      try {
        if (window.festappLocalDevelopmentReady) {
          await window.festappLocalDevelopmentReady;
        }
        window.prepareFestappFlutterBootstrap();
        {{flutter_js}}
        {{flutter_build_config}}

        _flutter.loader.load({
          onEntrypointLoaded: async function(engineInitializer) {
            try {
              const appRunner = await engineInitializer.initializeEngine({
                useColorEmoji: true
              });
              await appRunner.runApp();
              const loader = document.getElementById('loader-content');
              if (loader) {
                loader.style.opacity = '0';
                loader.style.pointerEvents = 'none';
                setTimeout(function() {
                  loader.remove();
                }, 400);
              }
            } catch (error) {
              console.error('Festapp Flutter startup failed:', error);
              if (window.recoverFestappStartup) {
                window.recoverFestappStartup('bootstrap-error');
              }
            }
          }
        });
      } catch (error) {
        console.error('Festapp Flutter bootstrap guard failed:', error);
        if (window.recoverFestappStartup) {
          window.recoverFestappStartup('bootstrap-guard-error');
        }
      }
    });
</script>

  .loader {
    height: 50px;
    width: 50px;
    aspect-ratio: 1;
    display: grid;
    border: 4px solid #0000;
    border-radius: 50%;
    border-color: #ccc #0000;
    animation: l16 1s infinite linear;
  }
  .loader::before,
  .loader::after {
    content: "";
    grid-area: 1/1;
    margin: 2px;
    border: inherit;
    border-radius: 50%;
  }
  .loader::before {
    border-color: #fd6206 #0000;
    animation: inherit;
    animation-duration: .5s;
    animation-direction: reverse;
  }
  .loader::after {
    margin: 8px;
  }
  @keyframes l16 {
    100%{transform: rotate(1turn)}
  }
</style>
