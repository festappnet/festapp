<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Account deletion | Festapp Tickets</title>
  <style>body{margin:0;background:#f6f7fb;color:#15182d;font:17px/1.55 system-ui,sans-serif}main{max-width:620px;margin:auto;padding:52px 22px}.card{background:white;border-radius:18px;padding:28px;box-shadow:0 8px 35px #19204018}button{border:0;border-radius:10px;padding:14px 18px;font:700 16px system-ui;cursor:pointer;background:#b42318;color:#fff}button:disabled{opacity:.55}a{color:#0000b8}.muted{color:#5a6178}</style>
</head>
<body><main><div class="card"><h1>Account deletion</h1><p id="status" role="status">Checking the one-time link...</p><div id="action" hidden><p>Deleting your account removes access to your account, participation, saved program and private data. Records required by law may remain without direct identity.</p><p><strong>Opening this page does not delete your account.</strong></p><button id="confirm" type="button">Permanently delete account</button></div><p class="muted"><a href="/privacy/choices">How account deletion works</a></p></div></main>
<script type="module">
const status = document.querySelector('#status');
const action = document.querySelector('#action');
const button = document.querySelector('#confirm');
const token = new URLSearchParams(location.search).get('token') || '';
const endpoint = "https://api.festapp.net/functions/v1/confirm-account-deletion";
const apiKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg3OTA4NjQyLCJleHAiOjE5NDU1ODg2NDJ9.uE20X1ueXZlul4F1fRfV5wXFVlGd8QKBFUHMIo1XD4M";
async function inspect() {
  if (!token) { status.textContent = "This link is invalid."; return; }
  try {
    const response = await fetch(`${endpoint}?token=${encodeURIComponent(token)}`, {method:'GET', headers:{apikey:apiKey}});
    const body = await response.json().catch(() => ({}));
    if (!response.ok || body.status !== 'valid') { status.textContent = response.status === 410 ? "This link has expired." : "This link is invalid or has already been used."; return; }
    status.textContent = `This link is valid until ${new Date(body.expiresAt).toLocaleString("en")}.`;
    action.hidden = false;
  } catch { status.textContent = "Verification failed. Please try again later."; }
}
button.addEventListener('click', async () => {
  if (!confirm("Permanently delete your entire account?")) return;
  button.disabled = true; status.textContent = "Processing account deletion...";
  try {
    const response = await fetch(endpoint, {method:'POST', headers:{'content-type':'application/json',apikey:apiKey}, body:JSON.stringify({token})});
    const body = await response.json().catch(() => ({}));
    if (response.ok && ['completed','already_completed','processing'].includes(body.status)) { action.hidden = true; status.textContent = body.status === 'processing' ? "Deletion is in progress. You can reload this page later." : "Your account has been deleted."; return; }
    status.textContent = response.status === 410 ? "This link has expired." : "Deletion failed. Please try again later.";
  } catch { status.textContent = "Deletion failed. Please try again later."; }
  button.disabled = false;
});
inspect();
</script></body></html>
