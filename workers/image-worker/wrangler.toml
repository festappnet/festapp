name = "festapp-image-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Transitional P1 routing. The two public hosts remain only until the measured
# installed-client gate permits their R2 custom-domain cutover (P3).
routes = [
  { pattern = "img.festapp.net", custom_domain = true },
  { pattern = "a.img.festapp.net", custom_domain = true },
  { pattern = "akh.img.festapp.net", custom_domain = true },
  { pattern = "image-api.festapp.net", custom_domain = true }
]

workers_dev = false

# R2 bucket bindings
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "festapp-images"

[[r2_buckets]]
binding = "IMAGES_BUCKET_A"
bucket_name = "festapp-images-a"

[[r2_buckets]]
binding = "IMAGES_BUCKET_AKHWEB"
bucket_name = "festapp-images-akhweb"

[[r2_buckets]]
binding = "IMAGES_PRIVATE_BUCKET"
bucket_name = "festapp-images-private"

[[r2_buckets]]
binding = "IMAGES_PRIVATE_BUCKET_A"
bucket_name = "festapp-images-a-private"

# Images binding for compression (requires Images subscription)
[images]
binding = "IMAGES"

# Secrets (set via `wrangler secret put`):
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_URL_A
# SUPABASE_ANON_KEY_A
# Festapp default/a secrets must use https://api.festapp.net and its anon key.
# Stale cloud endpoints are rejected by the registry and deployment probe.
# SUPABASE_URL_AKHWEB
# SUPABASE_ANON_KEY_AKHWEB
# R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY
# CF_ACCOUNT_ID
# CF_CACHE_PURGE_TOKEN

[vars]
CF_ZONE_ID = "02fd6ca8f4652d62e9b05f24a5e9d84f"
CONTROL_ALLOWED_ORIGINS = "https://live.festapp.net,https://csmostrava.festapp.net,https://vstupenky.online,https://praha.akhcr.cz,https://akhweb.netlify.app,https://slunovrat.festapp.net,https://app.festivalslunovrat.cz,https://app.absolventskyvelehrad.cz,https://csa2024.festapp.net,https://clovekavira.festapp.net,https://biscup.festapp.net,https://farnostopava.festapp.net,https://hvezdamorska.festapp.net,https://jubileum2025.festapp.net"

# Public canonical Auth endpoint and anon key, scoped to Slunovrat uploads.
SUPABASE_URL_SLUNOVRAT = "https://api.festapp.net"
SUPABASE_ANON_KEY_SLUNOVRAT = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg3OTA4NjQyLCJleHAiOjE5NDU1ODg2NDJ9.uE20X1ueXZlul4F1fRfV5wXFVlGd8QKBFUHMIo1XD4M"

# Native per-location best effort for uncached public reads. No DB on CDN hit.
[[ratelimits]]
name = "IMAGE_READ_MISS_BUDGET"
namespace_id = "2026101602"
simple = { limit = 5000, period = 60 }
