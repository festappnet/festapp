name = "festapp-self-hosted-monitor"
main = "src/index.mjs"
compatibility_date = "2026-09-02"
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 1

[[r2_buckets]]
binding = "EVIDENCE_BUCKET"
bucket_name = "festapp-supabase-backups"

[triggers]
crons = ["* * * * *"]

[vars]
MONITORING_URL = "https://festapp-monitoring.festapp.workers.dev"
MONITORING_RELEASE = "v1"
FESTAPP_API_URL = "https://api.festapp.net"

[[services]]
binding = "MONITORING_SERVICE"
service = "festapp-monitoring"
