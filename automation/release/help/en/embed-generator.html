<form class="embed-generator" data-embed-generator data-form-origin="{{FORM_ORIGIN}}" novalidate>
<div class="field"><label for="form-url">Public form link</label><input id="form-url" name="form-url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="{{FORM_ORIGIN}}/form/your-form" aria-describedby="form-url-hint form-url-error" required><p id="form-url-hint" class="hint">Save the form in your administration first. This generator creates no orders or reservations.</p><p id="form-url-error" data-url-error></p></div>
<div class="field"><label for="height-mode">Form height</label><select id="height-mode" name="height-mode"><option value="automatic">Automatic height (recommended)</option><option value="fixed">Fixed height without a script</option></select></div>
<div class="field"><label class="check-label"><input type="checkbox" name="inherit-style">Use the page font and colors</label></div>
<button class="button primary" type="submit">Prepare HTML code</button><p role="status" aria-live="polite"></p>
<div data-embed-output hidden><label for="embed-code">Code to embed</label><textarea id="embed-code" readonly spellcheck="false" rows="12"></textarea><div class="output-actions"><button class="button primary" type="button" data-copy-embed>Copy code</button><a data-form-link target="_blank" rel="noopener noreferrer">Open the standalone form</a></div></div></form>
<noscript><p>The generator needs JavaScript. You can also copy the embed code from your saved form's administration.</p></noscript>
