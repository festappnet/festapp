
# Deployment Configuration
DOMAIN=vstupenky.online

# DEPLOY_TARGET picks the CI deploy job in .github/workflows/deploy.yml:
#   cloudflare | skip
# Leave blank or set to "skip" to opt main / non-prod branches out of CI deploys.
DEPLOY_TARGET=

# Cloudflare Pages project name (required when DEPLOY_TARGET=cloudflare).
CLOUDFLARE_PROJECT_NAME=
# Optional first-cutover guard. When both values are set, deployment may replace
# only the one exact legacy DNS record after the first Pages bundle is live.
CLOUDFLARE_LEGACY_DNS_TYPE=
CLOUDFLARE_LEGACY_DNS_TARGET=


# Application Configuration
APP_NAME="Festapp"
APP_TITLE_SHORT="Festapp"
APP_DESCRIPTION="Platforma pro správu akcí, programu a vstupenek."
IOS_BUNDLE_NAME="Festapp"
VERSION=0.20.1+485
FLUTTER_VERSION=3.47.2

# Public tenant identities. These values are propagated into native and web
# build inputs by apply_config.sh; generated files are never their owner.
ANDROID_APPLICATION_ID=fstapp.fstapp
IOS_BUNDLE_ID=festapp.festapp
IOS_DEVELOPMENT_TEAM=8WKBB6L8LT
IOS_PROVISIONING_PROFILE=
IOS_ONESIGNAL_PROVISIONING_PROFILE=
