# Optional one-way rollout contract. When populated, the release starts on
# SUPABASE_URL and accepts only the exact canonical activation document emitted
# at WEB_LINK/backend-activation.json. Set phase=canonical at the operational
# cutover; installed transition clients do not require another store release.
BACKEND_ACTIVATION_TENANT_ID=
BACKEND_ACTIVATION_PHASE=
BACKEND_ACTIVATION_CANONICAL_SUPABASE_URL=
BACKEND_ACTIVATION_CANONICAL_SUPABASE_ANON_KEY=
BACKEND_ACTIVATION_CANONICAL_ORGANIZATION_ID=
