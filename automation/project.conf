ORGANIZATION_ID=1
FLUTTER_APP_URL=
IS_APP_SUPPORTED=true
WEB_IS_ALL_UNIT=false
WEB_SUPPORTED_LANGUAGES=cs
WEB_LINK=https://vstupenky.online

