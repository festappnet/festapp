
# Deployment Configuration
DOMAIN=slunovrat.festapp.net

# DEPLOY_TARGET picks the CI deploy job in .github/workflows/deploy.yml:
#   cloudflare | skip
# Leave blank or set to "skip" to opt main / non-prod branches out of CI deploys.
DEPLOY_TARGET=cloudflare

# Cloudflare Pages project name (required when DEPLOY_TARGET=cloudflare).
CLOUDFLARE_PROJECT_NAME=festivalslunovrat
CLOUDFLARE_MANAGE_DNS=false
# Optional first-cutover guard. When both values are set, deployment may replace
# only the one exact legacy DNS record after the first Pages bundle is live.
CLOUDFLARE_LEGACY_DNS_TYPE=A
CLOUDFLARE_LEGACY_DNS_TARGET=75.2.60.5


