const video=document.querySelector('video');const pill=document.querySelector('.success h1');let flashes=new Set();function tick(){const t=video.currentTime;document.body.classList.toggle('confirmed',t>=__ACCEPTED__&&t<__REJECTED__);document.body.classList.toggle('rejected',t>=__REJECTED__);pill.textContent=t>=__REJECTED__?'Ne':'Ano';for(const at of [__FLASH_ONE__,__FLASH_TWO__])if(t>=at&&!flashes.has(at)){flashes.add(at);document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),150)}requestAnimationFrame(tick)}tick();window.playTake=async()=>{video.currentTime=0;flashes.clear();document.body.classList.remove('confirmed','rejected','flash');await video.play()};
