<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Plánky - webový klient</title>
<style>
:root{font:15px system-ui;color:#202632;background:#eef0f3;--panel:#fff;--border:#c9ced5;--workspace:#dfe3e8;--ink:#202632;--accent:#25436c}*{box-sizing:border-box}body{margin:0}.dark{color-scheme:dark;color:#e5e8ed;background:#171a1e;--panel:#24282e;--border:#4a505a;--workspace:#30353c;--ink:#e5e8ed;--accent:#8bc7fa}header{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--border)}h1{font-size:18px;margin:0 12px 0 0}select,button,a.action{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:9px 13px;text-decoration:none}button{cursor:pointer}button:disabled{opacity:.5}select{min-width:280px}a{color:var(--accent)}.details{padding:12px 20px;background:var(--panel)}#status{font-weight:600}#notice,#receipt{font-size:13px;margin-top:6px;line-height:1.5}#receipt{color:var(--accent)}#error{padding:14px;background:#a12626;color:white}main{position:relative;background:var(--workspace);height:calc(100dvh - 230px);min-height:420px;padding:14px}#viewer{width:100%;height:100%}.venue-layout-viewer{height:100%}.controls{position:absolute;right:26px;bottom:24px;display:flex;gap:6px}#cart{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 18px;box-shadow:0 5px 24px #0003;white-space:nowrap}#cart span,#cart strong{margin-right:16px}footer{padding:12px 20px;font-size:13px}button:focus-visible,select:focus-visible{outline:3px solid #65a8eb;outline-offset:2px}@media(max-width:700px){main{height:65dvh}.controls{top:20px;bottom:auto}#cart{font-size:13px;bottom:16px;padding:8px}select{width:100%}}
</style>
<header><h1>Plánky ve webovém klientu</h1><select id="plans" aria-label="Vybrat plánek"></select><button id="refresh">Obnovit obsazenost</button><button id="theme">Světlý / tmavý</button><a id="full-form" class="action" hidden>Otevřít celý formulář →</a><a id="source" target="_blank" rel="noopener" hidden>Živý prodej ↗</a></header>
<section class="details"><div id="status" role="status"></div><div id="notice"></div><div id="receipt"></div><div id="error" role="alert" hidden></div></section>
<main><div id="viewer"></div><div class="controls"><button id="zoom-out" aria-label="Oddálit">−</button><button id="zoom-in" aria-label="Přiblížit">+</button><button id="fit">Celý plánek</button></div><div id="cart" hidden><span id="selection"></span><strong id="price"></strong><button id="reset">Zrušit výběr</button></div></main>
<footer><a href="/form/bp-form-2d9df639-90a8-4ab8-9d57-dfc6af05988b#seat-selection" target="_blank" rel="noopener">Kompletní objednávkový formulář na testovacích datech ↗</a></footer><script type="module" src="/src/dev/blueprint_preview.js"></script></html>
