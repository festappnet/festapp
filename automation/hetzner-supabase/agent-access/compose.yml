services:
  agent-diagnostics:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8789:8789"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    volumes:
      - /etc/festapp-agent/broker.json:/run/secrets/broker.json:ro
      - /etc/festapp-agent/pgpass:/run/secrets/pgpass:ro
    networks: [runtime]
networks:
  runtime:
    external: true
    name: ${FESTAPP_RUNTIME_DOCKER_NETWORK:?verified runtime network required}
