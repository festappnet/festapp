x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.11.4@sha256:1172d4213087d3fc30bafc7ff2c2896180eb0c41ff7f75f315568fb36cabdcba
    container_name: festapp-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      FESTAPP_SUPABASE_HOSTNAME: ${FESTAPP_SUPABASE_HOSTNAME:-rehearsal-api.festapp.net}
      FESTAPP_SUPABASE_SITE_ADDRESSES: ${FESTAPP_SUPABASE_SITE_ADDRESSES:-rehearsal-api.festapp.net}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *logging
  studio:
    image: supabase/studio:2026.08.03-sha-022b374@sha256:cb20b9a2b8fbb4f47a616c959dfdbde75668603c38d5ddd018e3f25a9f009937
    logging: *logging
  api-gw:
    image: envoyproxy/envoy:v1.39.0@sha256:5edd669228659835ac243e3ffa5c08a65e92bb267d56da5c28317dbcf5a70292
    ports: !override
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8443:8443"
    logging: *logging
  auth:
    image: supabase/gotrue:v2.189.0@sha256:cce6c1d00352f22ee7634066012830f69636c157017ea166634c48dbb58eefb7
    logging: *logging
  rest:
    image: postgrest/postgrest:v14.12@sha256:844785450d6b046ee97f1c67ea37e3ff6b4ed7ee3570b1b91c03f66f032c4805
    logging: *logging
  realtime:
    image: supabase/realtime:v2.102.3@sha256:11651eb260639365adfd8d886ac1bfba9b069440cf92cc29f400f3b4a6554cb9
    logging: *logging
  storage:
    image: supabase/storage-api:v1.60.4@sha256:9326eb9c6b74c0a5ba393ab46a08a51d16bc5ea5f2978fc5b0f17fc67c64a4de
    logging: *logging
  imgproxy:
    image: darthsim/imgproxy:v3.30.1@sha256:74215045236d40d5ee31868aeb72ee7940ae1f38a81ad8f8e6f7e53acb5b563c
    logging: *logging
  meta:
    image: supabase/postgres-meta:v0.96.6@sha256:abbb468e4e5a14b5b4edd29caf1fa1d98ee606da89fed3bfc653a6f85985401a
    logging: *logging
  functions:
    image: supabase/edge-runtime:v1.74.0@sha256:ac5a8314e0c45b0f65d091643c1d6f5293e3a38f31fd3d15186e04a9d5c91cb7
    environment:
      FESTAPP_ALLOWED_WEB_ORIGINS: ${FESTAPP_ALLOWED_WEB_ORIGINS:-https://festapp-rehearsal.invalid}
      DEFAULT_EMAIL: ${SMTP_ADMIN_EMAIL}
      SMTP_HOSTNAME: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: "true"
      SMTP_USER_NAME: ${SMTP_USER}
      SMTP_USER_PASSWORD: ${SMTP_PASS}
      PROJECT_URL: http://api-gw:8000
      QR_RATE_SALT: ${QR_RATE_SALT:?configure QR_RATE_SALT before starting Edge Functions}
      AWS_SNS_TOPIC_ARN: ${AWS_SNS_TOPIC_ARN:?configure the exact AWS SNS topic ARN}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:?configure the notification webhook token}
    logging: *logging
  db:
    image: supabase/postgres:17.6.1.136@sha256:a9946f08d31e8eb1149229c94e5c26603a9233116807cbbd93d75179cbac516a
    logging: *logging
  supavisor:
    image: supabase/supavisor:2.9.5@sha256:1dd306835b0215909cf76371a7a20be71268bbc97619f7133b882c5e9a7392e8
    ports: !reset []
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
