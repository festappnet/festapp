x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.11.4@sha256:1172d4213087d3fc30bafc7ff2c2896180eb0c41ff7f75f315568fb36cabdcba
    container_name: festapp-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      FESTAPP_SUPABASE_HOSTNAME: ${FESTAPP_SUPABASE_HOSTNAME:-rehearsal-api.festapp.net}
      FESTAPP_SUPABASE_SITE_ADDRESSES: ${FESTAPP_SUPABASE_SITE_ADDRESSES:-rehearsal-api.festapp.net}
      FESTAPP_SUPABASE_ADMIN_SITE: ${FESTAPP_SUPABASE_ADMIN_SITE:-http://127.0.0.1:8999}
      FESTAPP_SUPABASE_ADMIN_HOSTNAME: ${FESTAPP_SUPABASE_ADMIN_HOSTNAME:-supabase.festapp.net}
      FESTAPP_SUPABASE_ADMIN_BASIC_AUTH: ${FESTAPP_SUPABASE_ADMIN_BASIC_AUTH:?configure the internal administrator origin credential}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *logging
  admin-tunnel:
    profiles:
      - admin-dashboard
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    container_name: festapp-supabase-admin-tunnel
    restart: unless-stopped
    network_mode: host
    # Compose implements file-backed secrets as bind mounts and therefore
    # preserves the root-only 0600 host permissions. Run as root inside this
    # capability-free, read-only container so the token never needs weaker
    # host permissions.
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:20241
      - run
      - --token-file
      - /run/secrets/admin_tunnel_token
    secrets:
      - admin_tunnel_token
    logging: *logging
  studio:
    image: supabase/studio:2026.11.02-sha-a05e7ec@sha256:6fede89ed2397566843f4913d575b062df7180e06dc434744c9cfed0c5a46d53
    entrypoint:
      - /bin/sh
      - /opt/festapp-studio/entrypoint.sh
    command:
      - node
      - apps/studio/server.js
    volumes:
      - ./studio-customization/entrypoint.sh:/opt/festapp-studio/entrypoint.sh:ro
      - ./studio-customization/install-logout.mjs:/opt/festapp-studio/install-logout.mjs:ro
      - ./studio-customization/logout.js:/opt/festapp-studio/logout.js:ro
    logging: *logging
  api-gw:
    image: envoyproxy/envoy:v1.39.6@sha256:eebc293321d015af3ce65cb2424d0a7aaab417a7101f2a4e57d514b7826789ba
    ports: !override
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8443:8443"
    logging: *logging
  auth:
    environment:
      GOTRUE_RATE_LIMIT_HEADER: X-Festapp-Client-IP
      GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_ENABLED: "true"
      GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_URI: pg-functions://postgres/public/password_verification_attempt_v1
    image: supabase/gotrue:v2.197.0@sha256:3439d5affb9e96395d1348521f4c675eea7096d8d76d18d4e31fcc08df802116
    logging: *logging
  rest:
    image: postgrest/postgrest:v14.18@sha256:dfa6464b877fa7b1b0be85740f6ce6985144b509a6edb5f09c5ee67e687e8c1f
    logging: *logging
  realtime:
    image: supabase/realtime:v2.148.3@sha256:b9595f81031fb95b78a6d34d365e31c2e946c8e9abc204c9f8efa9c97de506ca
    logging: *logging
  meta:
    image: supabase/postgres-meta:v0.100.0@sha256:e3e00f3d8315884717b9751cbf47888a0359c640097d96abff987de37a0edf81
    logging: *logging
  functions:
    mem_limit: 2147483648
    command: !override [start, --user-worker-request-idle-timeout, "150000", --main-service, /home/deno/functions/main]
    image: supabase/edge-runtime:v1.77.9@sha256:37da62f867b8d7e636e9d62c65497ecaa9f05bfa37bc70c2dc9ccb06461ff982
    environment:
      DENO_TLS_CA_STORE: system,mozilla
      FESTAPP_MCP_TENANTS_JSON: ${FESTAPP_MCP_TENANTS_JSON:-[]}
      FESTAPP_TRUSTED_IP_HEADER: X-Festapp-Client-IP
      GOOGLE_AUTH_TRUSTED_IP_HEADER: X-Festapp-Client-IP
      FESTAPP_ALLOWED_WEB_ORIGINS: ${FESTAPP_ALLOWED_WEB_ORIGINS:-https://festapp-rehearsal.invalid}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
      GOOGLE_OIDC_CLIENT_SECRET: ${GOOGLE_OIDC_CLIENT_SECRET:-}
      GOOGLE_OIDC_CALLBACK_URL: ${GOOGLE_OIDC_CALLBACK_URL:-}
      GOOGLE_AUTH_ENCRYPTION_KEY: ${GOOGLE_AUTH_ENCRYPTION_KEY:-}
      GOOGLE_AUTH_MAILBOX_HMAC_KEY: ${GOOGLE_AUTH_MAILBOX_HMAC_KEY:-}
      GOOGLE_AUTH_WEBAUTHN_INGRESS: ${GOOGLE_AUTH_WEBAUTHN_INGRESS:-}
      BANKSYNC_INSTANCE_ID: ${BANKSYNC_INSTANCE_ID:-}
      BANKSYNC_API_URL: ${BANKSYNC_API_URL:-}
      BANKSYNC_TENANT_ADMIN_KEY: ${BANKSYNC_TENANT_ADMIN_KEY:-}
      BANKSYNC_WEBHOOK_SECRET: ${BANKSYNC_WEBHOOK_SECRET:-}
      BANKSYNC_CONTROL_KEY_VERSION: ${BANKSYNC_CONTROL_KEY_VERSION:-1}
      BANKSYNC_CONTROL_KEY_1: ${BANKSYNC_CONTROL_KEY_1:-}
      # Empty by default; provision only for an explicitly enabled Stripe preview.
      STRIPE_MODE: ${STRIPE_MODE:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PLATFORM_ACCOUNT_ID: ${STRIPE_PLATFORM_ACCOUNT_ID:-}
      STRIPE_API_VERSION: ${STRIPE_API_VERSION:-}
      STRIPE_ALLOWED_ORIGINS: ${STRIPE_ALLOWED_ORIGINS:-[]}
      STRIPE_CONNECT_CLIENT_ID: ${STRIPE_CONNECT_CLIENT_ID:-}
      STRIPE_CONNECT_CALLBACK_URL: ${STRIPE_CONNECT_CALLBACK_URL:-}
      STRIPE_WEBHOOK_SECRETS: ${STRIPE_WEBHOOK_SECRETS:-[]}
      DEFAULT_EMAIL: ${SMTP_ADMIN_EMAIL}
      PROJECT_URL: http://api-gw:8000
      QR_RATE_SALT: ${QR_RATE_SALT:?configure QR_RATE_SALT before starting Edge Functions}
      AWS_SNS_TOPIC_ARN: ${AWS_SNS_TOPIC_ARN:?configure the exact AWS SNS topic ARN}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:?configure the notification webhook token}
      TICKET_BATCH_SERVICE_SECRET: ${TICKET_BATCH_SERVICE_SECRET:?configure the dedicated Worker batch capability}
      TICKET_FONT_SERVICE_SECRET: ${TICKET_FONT_SERVICE_SECRET:?configure the dedicated Worker font capability}
      ASSET_CLEANUP_SERVICE_SECRET: ${ASSET_CLEANUP_SERVICE_SECRET:?configure the dedicated account asset cleanup capability}
    logging: *logging
  db:
    image: supabase/postgres:17.12.0.000@sha256:6c056e9a0f81d423c1a81fdf4e6587c16efd3f63960897371dab8ae2694a4714
    logging: *logging
  supavisor:
    image: supabase/supavisor:2.9.13@sha256:98861660eb5f2ef229c383b0cf1532c7937705c60513d2edf0c0cd1523d61437
    ports: !reset []
    logging: *logging

volumes:
  caddy-data:
  caddy-config:

secrets:
  admin_tunnel_token:
    file: ${FESTAPP_ADMIN_TUNNEL_TOKEN_FILE:-/etc/festapp-cloudflared/admin-tunnel.token}
