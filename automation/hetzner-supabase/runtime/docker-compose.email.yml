# Reviewed opt-in email cutover overlay. No sends while email_capacity.paused=true.
# SES credentials are filtered by the host router to process-email-queue only.
services:
  functions:
    environment:
      FESTAPP_MONITORING_URL: ${FESTAPP_MONITORING_URL:-}
      FESTAPP_MONITORING_TOKEN: ${FESTAPP_MONITORING_TOKEN:-}
      FESTAPP_MONITORING_RELEASE: ${FESTAPP_MONITORING_RELEASE:-v1}
      EMAIL_SES_ACCOUNT_ID: ${EMAIL_SES_ACCOUNT_ID:?verify account identity and shared budget}
      EMAIL_SES_REGION: ${EMAIL_SES_REGION:?verify SES region}
      EMAIL_SES_ACCESS_KEY_ID: ${EMAIL_SES_ACCESS_KEY_ID:?configure the sender SES credential}
      EMAIL_SES_SECRET_ACCESS_KEY: ${EMAIL_SES_SECRET_ACCESS_KEY:?configure the sender SES credential}
      EMAIL_SES_SESSION_TOKEN: ${EMAIL_SES_SESSION_TOKEN:-}
      EMAIL_SES_TRANSACTIONAL_SET: ${EMAIL_SES_TRANSACTIONAL_SET:?configure safe provider feedback}
      EMAIL_SES_ENGAGEMENT_SET: ${EMAIL_SES_ENGAGEMENT_SET:-}
      EMAIL_SES_SECURITY_SET: ${EMAIL_SES_SECURITY_SET:?configure feedback without tracking}
      EMAIL_SAFE_CLICK_ORIGINS: ${EMAIL_SAFE_CLICK_ORIGINS:-}
      EMAIL_PAYLOAD_KEY: ${EMAIL_PAYLOAD_KEY:?configure a base64 32-byte payload key}
      EMAIL_SNS_TOPIC_ARN: ${EMAIL_SNS_TOPIC_ARN:?configure the exact feedback topic}
      APP_LINKS_ORGANIZATION_ID: ${APP_LINKS_ORGANIZATION_ID:?resolve organization from tenant activation}
      AUTH_EMAIL_PUBLIC_URL: ${AUTH_EMAIL_PUBLIC_URL:?configure the public HTTPS Auth API origin}
      AUTH_EMAIL_HOOK_SECRET: ${AUTH_EMAIL_HOOK_SECRET:?configure the signed GoTrue hook}
    # Existing SMTP variables are removed only in the approved cutover overlay.
    # SMTP configuration for unrelated incoming bank mail is untouched.
  auth:
    environment:
      GOTRUE_HOOK_SEND_EMAIL_ENABLED: "true"
      GOTRUE_HOOK_SEND_EMAIL_URI: ${AUTH_EMAIL_PUBLIC_URL:?configure the public HTTPS Auth API origin}/functions/v1/auth-email-hook
      GOTRUE_HOOK_SEND_EMAIL_SECRETS: ${AUTH_EMAIL_HOOK_SECRET:?configure the signed GoTrue hook}
      GOTRUE_SMTP_HOST: ""
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
