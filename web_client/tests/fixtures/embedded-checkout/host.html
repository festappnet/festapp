<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-site embedded checkout fixture</title>
<style>body{font:16px system-ui;margin:16px}iframe{display:block;width:100%;border:1px solid #aaa}main{max-width:900px;margin:auto}</style>
<main><h1>Synthetic organizer site</h1><p>This fixture must be opened at http://localhost:59801. Its checkout uses http://127.0.0.1:59801, a different site.</p><div id="frames"></div></main>
<script type="module">
if(location.hostname!=='localhost')throw Error('Host must be localhost for cross-site coverage');
const params=new URLSearchParams(location.search);
const fixed=params.get('mode')==='fixed'||params.has('reject');
const inheritStyle=params.get('style')==='inherit'&&!params.has('reject');
if(inheritStyle){
 const style=document.createElement('style');
 style.textContent='@font-face{font-family:"Organizer Website";src:url("/src/assets/fonts/GillSansBold.otf");font-weight:700}body{font-family:"Organizer Website",serif;color:#203028;background:#faf8f1;--wp--preset--color--primary:#265740}';
 document.head.append(style);
}
for(let i=0;i<(params.has('two')?2:1);i++){
 const frame=document.createElement('iframe');frame.title='Synthetic order '+(i+1);frame.height='800';
 frame.src=params.has('result')
   ? 'http://127.0.0.1:59801/tests/fixtures/embedded-checkout/result-transition.html?delay='+encodeURIComponent(params.get('delay')||'0')
   : params.has('long')
   ? 'http://127.0.0.1:59801/tests/fixtures/embedded-checkout/long-preview.html'+(params.has('large')?'?large=1':'')
   : 'http://127.0.0.1:59801/form/'+(params.get('form')||'embedded-synthetic')+'?embed=1';
 if(!fixed||inheritStyle)frame.dataset.festappEmbed='';
 if(inheritStyle){frame.dataset.festappStyle='inherit';if(fixed)frame.dataset.festappHeight='fixed';}
 if(params.has('reject'))frame.addEventListener('load',()=>frame.contentWindow.postMessage({namespace:'festapp-embed',protocol:99,type:'init',instance:'rejected',viewportHeight:844},'http://127.0.0.1:59801'));
 const host=document.createElement('div');host.dataset.festappEmbedHost='';host.append(frame);document.querySelector('#frames').append(host);
 const link=document.createElement('a');link.textContent='Open order in a new tab';link.href=frame.src.split('?')[0];link.target='_blank';link.rel='noopener noreferrer';document.querySelector('#frames').append(link);
}
if(params.has('result')){const footer=document.createElement('footer');footer.textContent='Synthetic content below checkout';footer.style.height='1200px';document.body.append(footer);}
if(!fixed||inheritStyle){const script=document.createElement('script');script.src='http://127.0.0.1:59801/embed.js';script.defer=true;document.head.append(script);}
</script></html>
