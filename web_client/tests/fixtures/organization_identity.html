<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Organizer identity fixture</title><link rel="stylesheet" href="/src/theme_config.css"><link rel="stylesheet" href="/src/components/forms/form_component.css"><style>body{margin:0;background:var(--background-color,#f5f5f5);color:var(--text-color);font-family:Arial,sans-serif}main{max-width:600px;margin:24px auto;padding:16px}form{padding:24px;background:var(--surface-color);border-radius:12px}input{display:block;box-sizing:border-box;width:100%;padding:12px;margin:8px 0 24px}button{font:inherit}form button{padding:12px 24px}nav{padding:16px;display:flex;gap:12px}</style></head><body><nav><button id="theme" type="button">Tmavý režim</button><button id="state" type="button">Skrýt identitu</button></nav><main><form><h1>Přihláška na kulturní večer</h1><label for="answer">Jméno účastníka</label><input id="answer" value="Rozpracovaná odpověď"><button type="submit">Pokračovat</button></form><div id="identity" class="organization-identity-slot"></div></main><script type="module">
import {OrganizationIdentityFooter} from '/src/components/forms/organization_identity_footer.js';
import {LocalizationService} from '/src/services/localization_service.js';
LocalizationService.translations=await (await fetch('/assets/translations/cs.json')).json();
const footer=new OrganizationIdentityFooter(document.querySelector('#identity'));
const value={unitId:1,revision:3,legalName:'Kulturní a vzdělávací spolek přátel dlouhých názvů Větřkovice',countryCode:'CZ',registrationNumber:'01234567',address:{street:'Dlouhá ulice 123',city:'Větřkovice',postalCode:'74743'},contactEmail:'info@example.test',phone:'+420 123 456 789',website:'https://example.test'};
footer.render(value);let shown=true;window.submits=0;document.querySelector('form').onsubmit=e=>{e.preventDefault();window.submits++;};
document.querySelector('#state').onclick=()=>{shown=!shown;footer.render(shown?value:null);};document.querySelector('#theme').onclick=()=>{document.documentElement.classList.toggle('dark');document.body.style.setProperty('--background-color','#14171c');document.body.style.setProperty('--surface-color','#292d34');document.body.style.setProperty('--text-color','#eee');};
</script></body></html>
