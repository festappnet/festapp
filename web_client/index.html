<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festapp</title>
    <meta name="description" content="Platforma pro správu akcí, programu a vstupenek.">
    <meta name="keywords" content="založení události, prodej vstupenek, registrace, akce, plesy, festivaly, festapp, vstupenky.online">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://live.festapp.net/">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Festapp",
      "url": "https://live.festapp.net/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://live.festapp.net/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://live.festapp.net/">
    <meta property="og:title" content="Festapp">
    <meta property="og:description" content="Platforma pro správu akcí, programu a vstupenek.">
    <meta property="og:image" content="https://live.festapp.net/android-chrome-512x512.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://live.festapp.net/">
    <meta property="twitter:title" content="Festapp">
    <meta property="twitter:description" content="Platforma pro správu akcí, programu a vstupenek.">
    <meta property="twitter:image" content="https://live.festapp.net/android-chrome-512x512.png">

    <!-- Used font stylesheets and their binaries are persisted by the Festapp
         service worker after their first real use. -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="manifest" href="/site.webmanifest">


    
    <!-- Main Style (Inject via JS) -->
    
    <script>
        // This handshake must not depend on the module it unlocks. A resumed
        // mobile worker can forget the client generation before loading JS.
        window.__FESTAPP_BUILD_VERSION__ = "0.20.138+622";
        const startupCopy = navigator.language.startsWith('cs') || navigator.language.startsWith('sk')
            ? { loading: 'Načítám aplikaci…', retry: 'Zkusit znovu', failed: 'Stránku se nepodařilo načíst.' }
            : { loading: 'Loading…', retry: 'Try again', failed: 'The page could not be loaded.' };
        function reportFestappClientVersion() {
            navigator.serviceWorker?.controller?.postMessage({
                type: 'FESTAPP_CLIENT_VERSION',
                version: window.__FESTAPP_BUILD_VERSION__,
            });
        }
        reportFestappClientVersion();
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('controllerchange', reportFestappClientVersion);
            navigator.serviceWorker.addEventListener('message', function(event) {
                if (event.data?.type === 'FESTAPP_REPORT_VERSION') reportFestappClientVersion();
            });
            window.addEventListener('focus', reportFestappClientVersion);
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') reportFestappClientVersion();
            });
        }

        window.markFestappAppReady = function() {
            if (window.__FESTAPP_APP_READY__ === true) return;
            window.__FESTAPP_APP_READY__ = true;
            document.getElementById('web-client-startup')?.remove();
            window.dispatchEvent(new Event('festapp-app-ready'));
        };
        window.failFestappWebClientStartup = function(reason) {
            if (window.__FESTAPP_APP_READY__ === true) return;
            window.__FESTAPP_WEB_STARTUP_FAILURE__ = reason;
            const fallback = document.getElementById('web-client-startup');
            if (fallback) {
                fallback.querySelector('p').textContent = startupCopy.failed;
                fallback.querySelector('button').hidden = false;
            }
            window.recoverFestappStartup?.(reason).catch(function(error) {
                console.warn('Festapp web startup recovery failed:', error);
            });
        };
        window.retryFestappWebClient = async function() {
            const button = document.querySelector('#web-client-startup button');
            if (button) button.disabled = true;
            try {
                await window.prepareFestappNetworkReload?.();
                window.location.reload();
            } catch (error) {
                if (button) button.disabled = false;
                console.warn('Festapp web reload failed:', error);
            }
        };
        window.addEventListener('error', function(event) {
            if (event.target?.tagName === 'SCRIPT' && event.target.type === 'module' &&
                event.target.src && new URL(event.target.src).origin === location.origin) {
                window.failFestappWebClientStartup('web-module-error');
            }
        }, true);
        window.addEventListener('unhandledrejection', function() {
            window.failFestappWebClientStartup('web-startup-error');
        });
        window.addEventListener('load', function() {
            window.setTimeout(function() {
                window.failFestappWebClientStartup('web-startup-timeout');
            }, 25000);
        });

        // Reuse the same bounded cache recovery as the Flutter entrypoint.
        // The combined web build already ships this canonical public script.
        if (!['localhost', '127.0.0.1', '::1'].includes(location.hostname)) {
            const recovery = document.createElement('script');
            recovery.src = '/festapp_update_prompt.js';
            recovery.onload = function() {
                if (window.__FESTAPP_WEB_STARTUP_FAILURE__) {
                    window.failFestappWebClientStartup(window.__FESTAPP_WEB_STARTUP_FAILURE__);
                }
            };
            document.head.appendChild(recovery);
        }

        // Simple console logger for development; could be replaced by a proper service
        window.onerror = function(msg, url, line, col, error) {
            console.error('Global Error:', msg, url, line, col, error);
            return false;
        };
    </script>
</head>
<body>
    <div id="web-client-startup" role="status"
         style="position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;color:#333;font:16px sans-serif;padding:24px;text-align:center">
        <p>Loading…</p>
        <button hidden onclick="window.retryFestappWebClient()"
                style="padding:12px 20px;font:inherit;cursor:pointer">Try again</button>
    </div>
    <script>
        document.querySelector('#web-client-startup p').textContent = startupCopy.loading;
        document.querySelector('#web-client-startup button').textContent = startupCopy.retry;
    </script>
    <div id="app" style="display: none;">
        <!-- Header -->
        <user-header id="universal-header"></user-header>

        <main>
            <!-- Search -->
            <div id="search-container" class="search-container">
                <i class="material-icons search-icon">search</i>
                <input type="text" id="event-search" class="search-input" placeholder="Hledat události...">
                <i class="material-icons clear-icon" id="clear-search">close</i>
            </div>

            <!-- Content -->
            <div id="events-grid"></div>
        </main>

        <!-- FAB -->
        <div id="feedback-fab"></div>
        
        <!-- Loading overlay for Flutter transition -->
        <div id="flutter-loader">
             <div class="sp-loader"></div>
        </div>
    </div>

    <div id="form-page-container" style="display: none;"></div>

    <!-- Application Entry (Module) -->
    <script type="module" src="/src/main.js"></script>
    <script type="module">
        async function persistUsedFontResources() {
            await navigator.serviceWorker.ready;
            if (!navigator.serviceWorker.controller) {
                await new Promise(function(resolve) {
                    navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
                });
            }
            if (document.readyState !== 'complete') {
                await new Promise(function(resolve) {
                    window.addEventListener('load', resolve, { once: true });
                });
            }
            const fontUrls = performance.getEntriesByType('resource')
                .map(function(entry) { return entry.name; })
                .filter(function(resourceUrl) {
                    const origin = new URL(resourceUrl).origin;
                    return origin === 'https://fonts.googleapis.com' ||
                        origin === 'https://fonts.gstatic.com';
                });
            await Promise.allSettled([...new Set(fontUrls)].map(function(resourceUrl) {
                // Re-fetch through the now-active worker. The browser may serve
                // its first-load copy locally; the worker persists it in Cache API.
                return fetch(resourceUrl, { mode: 'cors', cache: 'force-cache' });
            }));
        }

        if ('serviceWorker' in navigator) {
            window.festappOfflineReady = navigator.serviceWorker.register('/festapp_service_worker.js', {
                scope: '/',
                updateViaCache: 'none'
            }).then(async function() {
                await navigator.serviceWorker.ready;
                reportFestappClientVersion();
                return persistUsedFontResources();
            }).catch(function(error) {
                console.warn('Festapp offline service worker registration failed:', error);
            });
        }
    </script>
</body>
</html>
