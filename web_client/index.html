    <!-- Main Style (Inject via JS) -->
    
    <script>
        // This handshake must not depend on the module it unlocks. A resumed
        // mobile worker can forget the client generation before loading JS.
        window.__FESTAPP_BUILD_VERSION__ = "0.20.157+641";
        const startupCopy = navigator.language.startsWith('cs') || navigator.language.startsWith('sk')
            ? { loading: 'Načítám aplikaci…', retry: 'Zkusit znovu', failed: 'Stránku se nepodařilo načíst.' }
            : { loading: 'Loading…', retry: 'Try again', failed: 'The page could not be loaded.' };
        function reportFestappClientVersion() {
            try {
                navigator.serviceWorker?.controller?.postMessage({
                    type: 'FESTAPP_CLIENT_VERSION',
                    version: window.__FESTAPP_BUILD_VERSION__,
                });
            } catch { /* Embedded browsers can deny service-worker access. */ }
        }
        reportFestappClientVersion();
        let startupServiceWorker;
        try { startupServiceWorker = navigator.serviceWorker; } catch { /* optional API */ }
        if (startupServiceWorker) {
            startupServiceWorker.addEventListener('controllerchange', reportFestappClientVersion);
            startupServiceWorker.addEventListener('message', function(event) {
                if (event.data?.type === 'FESTAPP_REPORT_VERSION') reportFestappClientVersion();
            });
            window.addEventListener('focus', reportFestappClientVersion);
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') reportFestappClientVersion();
            });
        }

        window.markFestappAppReady = function() {
            if (window.__FESTAPP_APP_READY__ === true) return;
            window.__FESTAPP_APP_READY__ = true;
            document.getElementById('web-client-startup')?.remove();
            window.dispatchEvent(new Event('festapp-app-ready'));
        };
        window.failFestappWebClientStartup = function(reason) {
            if (window.__FESTAPP_APP_READY__ === true) return;
            window.__FESTAPP_WEB_STARTUP_FAILURE__ = reason;
            const fallback = document.getElementById('web-client-startup');
            if (fallback) {
                fallback.querySelector('p').textContent = startupCopy.failed;
                fallback.querySelector('button').hidden = false;
            }
            window.recoverFestappStartup?.(reason).catch(function(error) {
                console.warn('Festapp web startup recovery failed:', error);
            });
        };
        window.retryFestappWebClient = async function() {
            const button = document.querySelector('#web-client-startup button');
            if (button) button.disabled = true;
            try {
                // A browser can cache an entry-script 404 for four hours. Reload
                // bypasses and replaces that native cache even without workers.
                const entry = document.querySelector('script[type="module"][src]');
                if (entry && new URL(entry.src).origin === location.origin) {
                    const controller = new AbortController();
                    const timeout = window.setTimeout(function() { controller.abort(); }, 10000);
                    try {
                        const response = await fetch(entry.src, { cache: 'reload', signal: controller.signal });
                        if (!response.ok || !/(?:java|ecma)script/i.test(response.headers.get('content-type') || '')) {
                            throw new Error('Entry script is unavailable');
                        }
                        await response.arrayBuffer();
                    } finally {
                        window.clearTimeout(timeout);
                    }
                }
                await window.prepareFestappNetworkReload?.();
                window.location.reload();
            } catch (error) {
                if (button) button.disabled = false;
                console.warn('Festapp web reload failed:', error);
            }
        };
        window.addEventListener('error', function(event) {
            if (event.target?.tagName === 'SCRIPT' && event.target.type === 'module' &&
                event.target.src && new URL(event.target.src).origin === location.origin) {
                window.failFestappWebClientStartup('web-module-error');
            }
        }, true);
        window.addEventListener('unhandledrejection', function() {
            window.failFestappWebClientStartup('web-startup-error');
        });
        window.addEventListener('load', function() {
            window.setTimeout(function() {
                window.failFestappWebClientStartup('web-startup-timeout');
            }, 25000);
        });

        // Reuse the same bounded cache recovery as the Flutter entrypoint.
        // The combined web build already ships this canonical public script.
        if (startupServiceWorker && !['localhost', '127.0.0.1', '::1'].includes(location.hostname)) {
            const recovery = document.createElement('script');
            recovery.src = '/festapp_update_prompt.js';
            recovery.onload = function() {
                if (window.__FESTAPP_WEB_STARTUP_FAILURE__) {
                    window.failFestappWebClientStartup(window.__FESTAPP_WEB_STARTUP_FAILURE__);
                }
            };
            document.head.appendChild(recovery);
        }

        // Simple console logger for development; could be replaced by a proper service
        window.onerror = function(msg, url, line, col, error) {
            console.error('Global Error:', msg, url, line, col, error);
            return false;
        };
    </script>

    <script type="module">
        let serviceWorker;
        try { serviceWorker = navigator.serviceWorker; } catch { /* optional API */ }
        async function persistUsedFontResources() {
            await serviceWorker.ready;
            if (!serviceWorker.controller) {
                await new Promise(function(resolve) {
                    serviceWorker.addEventListener('controllerchange', resolve, { once: true });
                });
            }
            if (document.readyState !== 'complete') {
                await new Promise(function(resolve) {
                    window.addEventListener('load', resolve, { once: true });
                });
            }
            const fontUrls = performance.getEntriesByType('resource')
                .map(function(entry) { return entry.name; })
                .filter(function(resourceUrl) {
                    const origin = new URL(resourceUrl).origin;
                    return origin === 'https://fonts.googleapis.com' ||
                        origin === 'https://fonts.gstatic.com';
                });
            await Promise.allSettled([...new Set(fontUrls)].map(function(resourceUrl) {
                // Re-fetch through the now-active worker. The browser may serve
                // its first-load copy locally; the worker persists it in Cache API.
                return fetch(resourceUrl, { mode: 'cors', cache: 'force-cache' });
            }));
        }

        if (serviceWorker) {
            window.festappOfflineReady = Promise.resolve().then(function() {
                return serviceWorker.register('/festapp_service_worker.js', {
                    scope: '/',
                    updateViaCache: 'none'
                });
            }).then(async function() {
                await serviceWorker.ready;
                reportFestappClientVersion();
                return persistUsedFontResources();
            }).catch(function(error) {
                console.warn('Festapp offline service worker registration failed:', error);
            });
        }
    </script>
