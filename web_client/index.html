<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slunovrat 2026</title>
    <meta name="description" content="Mobilní aplikace pro Festival Slunovrat.">
    <meta name="keywords" content="založení události, prodej vstupenek, registrace, akce, plesy, festivaly, festapp, vstupenky.online">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://slunovrat.festapp.net/">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Slunovrat 2026",
      "url": "https://slunovrat.festapp.net/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://slunovrat.festapp.net/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://slunovrat.festapp.net/">
    <meta property="og:title" content="Slunovrat 2026">
    <meta property="og:description" content="Mobilní aplikace pro Festival Slunovrat.">
    <meta property="og:image" content="https://slunovrat.festapp.net/android-chrome-512x512.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://slunovrat.festapp.net/">
    <meta property="twitter:title" content="Slunovrat 2026">
    <meta property="twitter:description" content="Mobilní aplikace pro Festival Slunovrat.">
    <meta property="twitter:image" content="https://slunovrat.festapp.net/android-chrome-512x512.png">

    <!-- Used font stylesheets and their binaries are persisted by the Festapp
         service worker after their first real use. -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="manifest" href="/site.webmanifest">


    
    <!-- Main Style (Inject via JS) -->
    
    <script>
        // Simple console logger for development; could be replaced by a proper service
        window.onerror = function(msg, url, line, col, error) {
            console.error('Global Error:', msg, url, line, col, error);
            return false;
        };
    </script>
</head>
<body>
    <div id="app" style="display: none;">
        <!-- Header -->
        <user-header id="universal-header"></user-header>

        <main>
            <!-- Search -->
            <div id="search-container" class="search-container">
                <i class="material-icons search-icon">search</i>
                <input type="text" id="event-search" class="search-input" placeholder="Hledat události...">
                <i class="material-icons clear-icon" id="clear-search">close</i>
            </div>

            <!-- Content -->
            <div id="events-grid"></div>
        </main>

        <!-- FAB -->
        <div id="feedback-fab"></div>
        
        <!-- Loading overlay for Flutter transition -->
        <div id="flutter-loader">
             <div class="sp-loader"></div>
        </div>
    </div>

    <div id="form-page-container" style="display: none;"></div>

    <!-- Application Entry (Module) -->
    <script type="module" src="/src/main.js"></script>
    <script type="module">
        import { APP_VERSION } from '/src/version.js';

        function reportFestappClientVersion() {
            navigator.serviceWorker.controller?.postMessage({
                type: 'FESTAPP_CLIENT_VERSION',
                version: APP_VERSION,
            });
        }

        async function persistUsedFontResources() {
            await navigator.serviceWorker.ready;
            if (!navigator.serviceWorker.controller) {
                await new Promise(function(resolve) {
                    navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
                });
            }
            if (document.readyState !== 'complete') {
                await new Promise(function(resolve) {
                    window.addEventListener('load', resolve, { once: true });
                });
            }
            const fontUrls = performance.getEntriesByType('resource')
                .map(function(entry) { return entry.name; })
                .filter(function(resourceUrl) {
                    const origin = new URL(resourceUrl).origin;
                    return origin === 'https://fonts.googleapis.com' ||
                        origin === 'https://fonts.gstatic.com';
                });
            await Promise.allSettled([...new Set(fontUrls)].map(function(resourceUrl) {
                // Re-fetch through the now-active worker. The browser may serve
                // its first-load copy locally; the worker persists it in Cache API.
                return fetch(resourceUrl, { mode: 'cors', cache: 'force-cache' });
            }));
        }

        if ('serviceWorker' in navigator) {
            window.festappOfflineReady = navigator.serviceWorker.register('/festapp_service_worker.js', {
                scope: '/',
                updateViaCache: 'none'
            }).then(async function() {
                await navigator.serviceWorker.ready;
                reportFestappClientVersion();
                return persistUsedFontResources();
            }).catch(function(error) {
                console.warn('Festapp offline service worker registration failed:', error);
            });
            navigator.serviceWorker.addEventListener('controllerchange', reportFestappClientVersion);
            navigator.serviceWorker.addEventListener('message', function(event) {
                if (event.data?.type === 'FESTAPP_REPORT_VERSION') reportFestappClientVersion();
            });
            window.addEventListener('focus', reportFestappClientVersion);
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') reportFestappClientVersion();
            });
        }
    </script>
</body>
</html>
