      const target = new URL(window.location.href);

      const operation = fragment.get('sale_opening'), token = fragment.get('token');
      const valid = operation === 'unsubscribe' && /^[a-f0-9]{64}$/.test(token || '') && fragment.getAll('token').length === 1;

    })();
