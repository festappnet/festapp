name: Database and ticketing regressions
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: read
jobs:
  seat-checkout:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps: &database-lane-steps
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select verified CI inputs
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/ci/selection.py ${{ github.job }}
      - uses: pnpm/action-setup@v6
        if: steps.selection.outputs.run == 'true'
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        if: steps.selection.outputs.run == 'true'
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: |
            web_client/pnpm-lock.yaml
            tools/festapp/pnpm-lock.yaml
            workers/image-worker/pnpm-lock.yaml
      - name: Install pinned Supabase CLI
        if: steps.selection.outputs.sql == 'true'
        run: bash automation/ci/supabase.sh
      - run: command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y postgresql-client; }
        if: steps.selection.outputs.sql == 'true'
      - uses: actions/setup-go@v7
        if: steps.selection.outputs.go == 'true'
        with:
          go-version-file: automation/hetzner-supabase/auth-ingress/go.mod
          cache-dependency-path: automation/hetzner-supabase/auth-ingress/go.sum
      - name: Restore pinned Chromium test runner
        if: steps.selection.outputs.browser == 'true'
        uses: ./.github/actions/restore-playwright-cache
      - name: Prepare isolated browser and database image
        if: steps.selection.outputs.run == 'true'
        env:
          FESTAPP_CI_NEEDS_DATABASE: ${{ steps.selection.outputs.sql }}
          FESTAPP_CI_NEEDS_BROWSER: ${{ steps.selection.outputs.browser }}
        run: bash automation/ci/prepare-seat.sh
      - name: Restore pinned Deno dependencies
        if: steps.selection.outputs.run == 'true'
        uses: ./.github/actions/restore-deno-cache
      - name: Install pinned Deno
        if: steps.selection.outputs.run == 'true'
        run: bash automation/ci/deno.sh
      - name: Run canonical regression DAG
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/ci/run.py lane ${{ github.job }}
      - name: All lane tests executed
        if: steps.selection.outputs.full == 'true'
        run: echo 'All lane tests executed'
      - name: Some lane tests executed
        if: steps.selection.outputs.run == 'true' && steps.selection.outputs.full != 'true'
        run: echo 'Some lane tests executed'
      - name: Lane coverage verified
        run: echo 'Lane coverage verified'
      - name: Preserve canonical CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.job }}-${{ github.run_attempt }}
          path: ~/.cache/festapp-ci/runs
          retention-days: ${{ steps.selection.outputs.evidence_retention_days }}
          if-no-files-found: ignore

  database-regressions:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps: *database-lane-steps

  mcp-database-contracts:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps: *database-lane-steps

  database-service-regressions:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps: *database-lane-steps

  ticket-preview-and-delivery:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FVM_CACHE_PATH: /tmp/festapp-fvm
    steps: &ticket-lane-steps
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select verified CI inputs
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/ci/selection.py ${{ github.job }}
      - name: Restore pinned Deno dependencies
        if: steps.selection.outputs.run == 'true'
        uses: ./.github/actions/restore-deno-cache
      - name: Install pinned Deno
        if: steps.selection.outputs.run == 'true'
        run: bash automation/ci/deno.sh
      - id: sdk
        if: steps.selection.outputs.flutter == 'true'
        run: echo "version=$(sed -n 's/^FLUTTER_VERSION=//p' automation/project.conf)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: steps.selection.outputs.flutter == 'true'
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - name: Use the installed SDK through FVM
        if: steps.selection.outputs.flutter == 'true'
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          mkdir -p "$FVM_CACHE_PATH/versions"
          ln -s "$FLUTTER_ROOT" "$FVM_CACHE_PATH/versions/${{ steps.sdk.outputs.version }}"
      - uses: pnpm/action-setup@v6
        if: steps.selection.outputs.run == 'true'
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        if: steps.selection.outputs.run == 'true'
        with:
          node-version: '22.23.4'
      - name: Run canonical regression DAG
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/ci/run.py lane ${{ github.job }}
      - name: All lane tests executed
        if: steps.selection.outputs.full == 'true'
        run: echo 'All lane tests executed'
      - name: Some lane tests executed
        if: steps.selection.outputs.run == 'true' && steps.selection.outputs.full != 'true'
        run: echo 'Some lane tests executed'
      - name: Lane coverage verified
        run: echo 'Lane coverage verified'
      - name: Preserve canonical CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.job }}-${{ github.run_attempt }}
          path: ~/.cache/festapp-ci/runs
          retention-days: ${{ steps.selection.outputs.evidence_retention_days }}
          if-no-files-found: ignore

  ticket-rendering-contracts:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FVM_CACHE_PATH: /tmp/festapp-fvm
    steps: *ticket-lane-steps
