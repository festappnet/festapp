name: Seat checkout regressions
on:
  push:
    branches: [main]
    paths:
      - 'database/functions/eshop/**'
      - 'database/functions/blueprint/**'
      - 'database/tests/blueprint/legacy_ticket_offer_test.sql'
      - 'database/functions/eshop_orders/**'
      - 'database/functions/eshop_waitlist/**'
      - 'database/functions/eshop_forms/**'
      - 'database/functions/notification_center/**'
      - 'database/tests/notification_center/**'
      - 'lib/components/notification_center/**'
      - 'test/components/notification_center/**'
      - 'automation/notification-center-feed-manifest.json'
      - 'automation/assemble-notification-center-migration.py'
      - 'database/tests/eshop_orders/required*test.sql'
      - 'database/tests/eshop_orders/manual_paid_state_only_test.sql'
      - 'database/tests/emails/paid_then_manual_ticket_delivery_test.sql'
      - 'supabase/functions/send-tickets/**'
      - 'supabase/functions/preview-ticket-layout/**'
      - 'supabase/functions/_shared/**'
      - 'lib/components/eshop/db_tickets.dart'
      - 'lib/components/eshop/views/orders_content.dart'
      - 'test/components/eshop/ticket_delivery_request_test.dart'
      - 'supabase/migrations/**'
      - 'supabase/baseline/**'
      - 'automation/baseline.py'
      - 'automation/historical-sql-manifest.json'
      - 'automation/bootstrap_local_db.sh'
      - 'automation/local_db/**'
      - 'web_client/package.json'
      - 'web_client/pnpm-lock.yaml'
      - 'web_client/pnpm-workspace.yaml'
      - 'web_client/src/**'
      - 'web_client/scripts/test_seat_checkout_browser.mjs'
      - 'web_client/scripts/test_form_access_browser.mjs'
      - 'web_client/tests/fixtures/form_access/**'
      - 'web_client/tests/fixtures/seat_checkout/**'
      - 'automation/ci/**'
      - '.github/workflows/seat-checkout-regressions.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seat-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres?sslmode=disable
      SEAT_CHECKOUT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: pnpm
          cache-dependency-path: web_client/pnpm-lock.yaml
      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0
      - run: command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y postgresql-client; }
      - run: python3 automation/ci/run.py step seat-install
      - name: Install isolated Chromium test runner
        run: bash automation/ci/browser.sh
      - run: python3 automation/ci/run.py step seat-database
      - name: Authorization read-phase upgrade contracts
        env:
          FESTAPP_AUTHORIZATION_POLICY_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: python3 automation/ci/run.py step seat-authorization
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.0'
      - name: Google broker admission against real SQL
        env:
          GOOGLE_AUTH_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: python3 automation/ci/run.py step seat-google-auth
      - name: Database contract and anonymous checkout
        run: python3 automation/ci/run.py step seat-contract
      - name: Notification feed and history authorization contracts
        run: python3 automation/ci/run.py step seat-notifications
      - name: Reserve a seat, lose connectivity and recover checkout in a real browser
        run: python3 automation/ci/run.py step seat-browser

  ticket-preview-and-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FVM_CACHE_PATH: /tmp/festapp-fvm
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.0'
      - name: Ticket preview colors and first-delivery intent
        run: python3 automation/ci/run.py step ticket-edge
      - id: sdk
        run: echo "version=$(sed -n 's/^FLUTTER_VERSION=//p' automation/project.conf)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - name: Use the installed SDK through FVM
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          mkdir -p "$FVM_CACHE_PATH/versions"
          ln -s "$FLUTTER_ROOT" "$FVM_CACHE_PATH/versions/${{ steps.sdk.outputs.version }}"
      - run: python3 automation/ci/run.py step ticket-install
      - name: Shared customer display labels
        run: python3 automation/ci/run.py step ticket-core
      - name: First delivery, notification feed and resend client requests
        run: python3 automation/ci/run.py step ticket-client
