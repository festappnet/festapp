name: Seat checkout regressions
on:
  push:
    branches: [main]
    paths:
      - 'database/functions/eshop/**'
      - 'database/functions/eshop_barion/**'
      - 'database/functions/eshop_stripe/**'
      - 'database/functions/payment_providers/**'
      - 'database/functions/abuse/policy.sql'
      - 'supabase/functions/_shared/barion/**'
      - 'supabase/functions/_shared/payments/**'
      - 'supabase/functions/_shared/stripe/**'
      - 'web_client/tests/database/barion*'
      - 'automation/payments/**'
      - 'automation/*barion*'
      - 'database/functions/blueprint/**'
      - 'database/tests/blueprint/legacy_ticket_offer_test.sql'
      - 'database/functions/eshop_orders/**'
      - 'database/functions/eshop_waitlist/**'
      - 'database/functions/eshop_forms/**'
      - 'database/functions/notification_center/**'
      - 'database/functions/occasion_setup/**'
      - 'database/tests/occasion_setup/**'
      - 'supabase/functions/occasion-setup-email-preview/**'
      - 'lib/components/occasion/setup/**'
      - 'lib/components/fonts/**'
      - 'lib/components/forms/**'
      - 'test/components/forms/form_appearance_theme_cases.dart'
      - 'test/components/occasion/occasion_setup*'
      - 'automation/generate_setup_appearance_fonts.mjs'
      - 'automation/tickets/setup-appearance-fonts.json'
      - 'database/tests/notification_center/**'
      - 'lib/components/notification_center/**'
      - 'test/components/notification_center/**'
      - 'automation/notification-center-feed-manifest.json'
      - 'automation/assemble-notification-center-migration.py'
      - 'database/tests/eshop_orders/required*test.sql'
      - 'database/tests/eshop_orders/manual_paid_state_only_test.sql'
      - 'database/functions/emails/**'
      - 'database/tests/emails/**'
      - 'database/tests/eshop/reminders/**'
      - 'database/tests/eshop/deposit/**'
      - 'automation/email-delivery/**'
      - 'supabase/functions/send-tickets/**'
      - 'supabase/functions/preview-ticket-layout/**'
      - 'supabase/functions/_shared/**'
      - 'lib/components/eshop/db_tickets.dart'
      - 'lib/components/eshop/views/orders_content.dart'
      - 'test/components/eshop/ticket_delivery_request_test.dart'
      - 'workers/image-worker/**'
      - 'database/functions/others/**'
      - 'database/functions/authoring/lifecycle.sql'
      - 'database/tests/occasion_copy_lifecycle_test.sql'
      - 'supabase/migrations/**'
      - 'supabase/baseline/**'
      - 'database/tests/canonical_mutation_source_parity_test.sql'
      - 'automation/generate_canonical_source_contract.py'
      - 'automation/canonical-source-contract.json'
      - 'automation/baseline.py'
      - 'automation/historical-sql-manifest.json'
      - 'automation/bootstrap_local_db.sh'
      - 'automation/local_db/**'
      - 'web_client/package.json'
      - 'web_client/pnpm-lock.yaml'
      - 'web_client/pnpm-workspace.yaml'
      - 'web_client/src/**'
      - 'web_client/scripts/test_seat_checkout_browser.mjs'
      - 'web_client/scripts/test_form_access_browser.mjs'
      - 'web_client/tests/fixtures/form_access/**'
      - 'web_client/tests/fixtures/seat_checkout/**'
      - 'automation/ci/**'
      - '.github/workflows/seat-checkout-regressions.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seat-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: pnpm
          cache-dependency-path: web_client/pnpm-lock.yaml
      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0
      - run: command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y postgresql-client; }
      - name: Install isolated Chromium test runner
        run: bash automation/ci/browser.sh
      - name: Install pinned Deno
        run: bash automation/ci/deno.sh
      - name: Run canonical regression DAG
        run: python3 automation/ci/run.py lane seat-checkout

  ticket-preview-and-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FVM_CACHE_PATH: /tmp/festapp-fvm
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Deno
        run: bash automation/ci/deno.sh
      - id: sdk
        run: echo "version=$(sed -n 's/^FLUTTER_VERSION=//p' automation/project.conf)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - name: Use the installed SDK through FVM
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          mkdir -p "$FVM_CACHE_PATH/versions"
          ln -s "$FLUTTER_ROOT" "$FVM_CACHE_PATH/versions/${{ steps.sdk.outputs.version }}"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
      - name: Run canonical regression DAG
        run: python3 automation/ci/run.py lane ticket-preview-and-delivery
