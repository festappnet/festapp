name: Wix checkout compatibility
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: read
jobs:
  wix-checkout-compatibility:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps: &cms-lane-steps
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select verified CI inputs
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/ci/selection.py ${{ github.job }}
      - uses: pnpm/action-setup@v6
        if: steps.selection.outputs.run == 'true'
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        if: steps.selection.outputs.run == 'true'
        with:
          node-version: '24.22.1'
          cache: pnpm
          cache-dependency-path: |
            integrations/wix/pnpm-lock.yaml
            web_client/pnpm-lock.yaml
      - uses: supabase/setup-cli@v3
        if: steps.selection.outputs.cms == 'true'
        with:
          version: 2.111.0
      - name: Ensure disposable backend SQL client
        if: steps.selection.outputs.cms == 'true'
        run: command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y postgresql-client; }
      - name: Identify pinned CMS browsers
        id: cms-browser-key
        if: steps.selection.outputs.cms == 'true'
        run: |
          cms_playwright_version="$(node -p "require('./web_client/package.json').devDependencies.playwright")"
          [[ "$cms_playwright_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          browser_suffix=''
          if [[ "${GITHUB_JOB:-}" == 'wix-checkout-compatibility' ]]; then browser_suffix='-chromium'; fi
          printf 'key=cms-browsers-%s-%s-%s-playwright-%s%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:?}" "$cms_playwright_version" "$browser_suffix" >> "$GITHUB_OUTPUT"
      - name: Restore pinned CMS browsers
        if: steps.selection.outputs.cms == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.cms-browser-key.outputs.key }}
      - name: Run canonical regression DAG
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/ci/run.py lane ${{ github.job }}
      - name: All lane tests executed
        if: steps.selection.outputs.full == 'true'
        run: echo 'All lane tests executed'
      - name: Some lane tests executed
        if: steps.selection.outputs.run == 'true' && steps.selection.outputs.full != 'true'
        run: echo 'Some lane tests executed'
      - name: Lane coverage verified
        run: echo 'Lane coverage verified'
      - name: Preserve canonical CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.job }}-${{ github.run_attempt }}
          path: ~/.cache/festapp-ci/runs
          retention-days: 7
          if-no-files-found: ignore

  wordpress-checkout-compatibility:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps: *cms-lane-steps
