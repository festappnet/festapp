name: Wix checkout compatibility
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: read
jobs:
  wix-checkout-compatibility:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select verified CI inputs
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/ci/selection.py wix-checkout-compatibility
      - uses: pnpm/action-setup@v6
        if: steps.selection.outputs.run == 'true'
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        if: steps.selection.outputs.run == 'true'
        with:
          node-version: '24.22.1'
          cache: pnpm
          cache-dependency-path: |
            integrations/wix/pnpm-lock.yaml
            web_client/pnpm-lock.yaml
      - name: Run canonical regression DAG
        env:
          GH_TOKEN: ${{ github.token }}
        if: steps.selection.outputs.run == 'true'
        run: python3 automation/ci/run.py lane wix-checkout-compatibility
      - name: All lane tests executed
        if: steps.selection.outputs.run == 'true'
        run: echo 'All lane tests executed'
      - name: Preserve canonical CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.job }}-${{ github.run_attempt }}
          path: ~/.cache/festapp-ci/runs
          retention-days: 7
          if-no-files-found: ignore
