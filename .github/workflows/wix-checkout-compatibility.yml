name: Wix checkout compatibility
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: read
jobs:
  wix-checkout-compatibility:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps: &cms-lane-steps
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select verified CI inputs
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/ci/selection.py ${{ github.job }}
      - uses: pnpm/action-setup@v6
        if: steps.selection.outputs.run == 'true'
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        if: steps.selection.outputs.run == 'true'
        with:
          node-version: '24.22.1'
          cache: pnpm
          cache-dependency-path: |
            integrations/wix/pnpm-lock.yaml
            integrations/wordpress/pnpm-lock.yaml
            web_client/pnpm-lock.yaml
      - name: Install pinned Supabase CLI
        if: steps.selection.outputs.cms == 'true'
        run: bash automation/ci/supabase.sh
      - name: Ensure disposable backend SQL client
        if: steps.selection.outputs.cms == 'true'
        run: command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y postgresql-client; }
      - name: Restore pinned WordPress core archive
        if: github.job == 'wordpress-checkout-compatibility' && steps.selection.outputs.cms == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/festapp-wordpress-core
          key: wordpress-core-${{ hashFiles('integrations/wordpress/core-archives.json') }}
      - name: Run canonical regression DAG
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/ci/run.py lane ${{ github.job }}
      - name: All lane tests executed
        if: steps.selection.outputs.full == 'true'
        run: echo 'All lane tests executed'
      - name: Some lane tests executed
        if: steps.selection.outputs.run == 'true' && steps.selection.outputs.full != 'true'
        run: echo 'Some lane tests executed'
      - name: Lane coverage verified
        run: echo 'Lane coverage verified'
      - name: Preserve canonical CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.job }}-${{ github.run_attempt }}
          path: ~/.cache/festapp-ci/runs
          retention-days: 7
          if-no-files-found: ignore

  wordpress-checkout-compatibility:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps: *cms-lane-steps
