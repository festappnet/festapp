name: Wix checkout compatibility
on:
  push:
    branches: [main]
    paths:
      - 'integrations/wix/**'
      - 'web_client/src/components/forms/**'
      - 'web_client/src/components/eshop/db_orders.js'
      - 'web_client/src/components/eshop/ticket_order_identity.js'
      - 'assets/translations/**'
      - 'web_client/public/assets/translations/**'
      - 'web_client/tests/forms/**'
      - 'web_client/tests/fixtures/embedded-checkout/**'
      - 'web_client/tests/components/db_orders_command_identity.test.js'
      - 'web_client/src/components/blueprint/**'
      - 'web_client/src/services/embed*'
      - 'web_client/src/services/browser_storage.js'
      - 'web_client/public/embed.js'
      - 'web_client/package.json'
      - 'web_client/pnpm-*.yaml'
      - 'web_client/tests/core/embed.test.js'
      - 'web_client/tests/core/browser_storage.test.js'
      - 'web_client/tests/forms/reservation_capability_store.test.js'
      - 'automation/ci/**'
      - '.github/workflows/wix-checkout-compatibility.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wix-checkout-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
          cache-dependency-path: |
            integrations/wix/pnpm-lock.yaml
            web_client/pnpm-lock.yaml
      - name: Install pinned Wix and checkout dependencies
        run: python3 automation/ci/run.py step wix-install
      - name: Verify wrapper and shared embed/storage contracts
        run: python3 automation/ci/run.py step wix-contract
