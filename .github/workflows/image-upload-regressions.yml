name: Image upload regressions
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/translations/cs.json'
      - 'assets/translations/en.json'
      - 'web_client/public/assets/translations/cs.json'
      - 'web_client/public/assets/translations/en.json'
      - 'web_client/pnpm-lock.yaml'
      - 'web_client/pnpm-workspace.yaml'
      - 'web_client/package.json'
      - 'tools/festapp/**'
      - 'packages/festapp_contracts/**'
      - 'web_client/src/components/mcp/**'
      - 'web_client/src/components/users/account_connections_page.js'
      - 'web_client/tests/components/mcp_connection_page.test.js'
      - 'web_client/tests/components/account_connections_page.test.js'
      - 'supabase/functions/mcp-session-exchange/**'
      - 'workers/image-worker/**'
      - 'lib/components/images/**'
      - 'lib/components/html/**'
      - 'lib/components/ticket_layout/**'
      - 'lib/components/blueprint/**'
      - 'lib/components/occasion_settings/**'
      - 'lib/components/schedule/**'
      - 'lib/components/speakers/**'
      - 'lib/components/email_templates/**'
      - 'test/**'
      - 'automation/testing/**'
      - 'lib/services/theme_preference/**'
      - 'lib/services/locale_preference/**'
      - 'lib/widgets/synced_adaptive_theme.dart'
      - 'lib/widgets/synced_locale.dart'
      - 'lib/startup/startup_language.dart'
      - 'automation/ci/**'
      - '.github/workflows/image-upload-regressions.yml'
  push:
    branches: [main]
    paths:
      - 'assets/translations/cs.json'
      - 'assets/translations/en.json'
      - 'web_client/public/assets/translations/cs.json'
      - 'web_client/public/assets/translations/en.json'
      - 'web_client/pnpm-lock.yaml'
      - 'web_client/pnpm-workspace.yaml'
      - 'web_client/package.json'
      - 'tools/festapp/**'
      - 'packages/festapp_contracts/**'
      - 'web_client/src/components/mcp/**'
      - 'web_client/src/components/users/account_connections_page.js'
      - 'web_client/tests/components/mcp_connection_page.test.js'
      - 'web_client/tests/components/account_connections_page.test.js'
      - 'supabase/functions/mcp-session-exchange/**'
      - 'workers/image-worker/**'
      - 'lib/components/images/**'
      - 'lib/components/html/**'
      - 'lib/components/ticket_layout/**'
      - 'lib/components/blueprint/**'
      - 'lib/components/occasion_settings/**'
      - 'lib/components/schedule/**'
      - 'lib/components/speakers/**'
      - 'lib/components/email_templates/**'
      - 'test/**'
      - 'automation/testing/**'
      - 'lib/services/theme_preference/**'
      - 'lib/services/locale_preference/**'
      - 'lib/widgets/synced_adaptive_theme.dart'
      - 'lib/widgets/synced_locale.dart'
      - 'lib/startup/startup_language.dart'
      - 'automation/ci/**'
      - '.github/workflows/image-upload-regressions.yml'
permissions:
  contents: read
jobs:
  server-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: pnpm
          cache-dependency-path: workers/image-worker/pnpm-lock.yaml
      - name: Install pinned Deno
        run: bash automation/ci/deno.sh
      - name: Run canonical regression DAG
        run: python3 automation/ci/run.py lane server-policy
      - name: Preserve canonical CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.job }}-${{ github.run_attempt }}
          path: ~/.cache/festapp-ci/runs
          retention-days: 7
          if-no-files-found: ignore

  client-contract:
    runs-on: ubuntu-latest
    env:
      FVM_CACHE_PATH: /tmp/festapp-fvm
    steps:
      - uses: actions/checkout@v7
      - id: sdk
        run: echo "version=$(sed -n 's/^FLUTTER_VERSION=//p' automation/project.conf)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - name: Use the installed SDK through FVM
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          mkdir -p "$FVM_CACHE_PATH/versions"
          ln -s "$FLUTTER_ROOT" "$FVM_CACHE_PATH/versions/${{ steps.sdk.outputs.version }}"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
      - name: Run canonical regression DAG
        run: python3 automation/ci/run.py lane client-contract
      - name: Preserve canonical CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.job }}-${{ github.run_attempt }}
          path: ~/.cache/festapp-ci/runs
          retention-days: 7
          if-no-files-found: ignore
