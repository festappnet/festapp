name: Web startup regressions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: pnpm
          cache-dependency-path: web_client/pnpm-lock.yaml
      - name: Install isolated Chromium test runner
        run: bash automation/ci/browser.sh
      - name: Install web test dependencies
        run: python3 automation/ci/run.py step web-install
      - name: Verify restricted WebViews and production module identity
        run: python3 automation/ci/run.py step web-startup
      - name: Install public renderer dependencies
        run: python3 automation/ci/run.py step renderer-install
      - name: Verify deployment gates
        run: python3 automation/ci/run.py step deploy-contract
