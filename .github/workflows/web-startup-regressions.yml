name: Web startup regressions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web_client/pnpm-lock.yaml
      - name: Install isolated Chromium test runner
        run: |
          # pnpm 11 places global executables in PNPM_HOME/bin.
          export PATH="$PNPM_HOME/bin:$PATH"
          echo "$PNPM_HOME/bin" >> "$GITHUB_PATH"
          pnpm add --global --allow-build=agent-browser agent-browser@0.33.1
          # The hosted runner already provides Chrome and its system libraries.
          # Avoid fetching optional font packages from the Ubuntu mirror.
          browser_path="$(command -v google-chrome)"
          echo "AGENT_BROWSER_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Install web test dependencies
        working-directory: web_client
        run: pnpm install --frozen-lockfile
      - name: Verify restricted WebViews and production module identity
        run: bash automation/test_web_startup.sh
      - name: Verify deployment gates
        run: bash automation/tests/deploy_workflow.test.sh
