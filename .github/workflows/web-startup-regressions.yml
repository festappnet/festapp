name: Web startup regressions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: pnpm
          cache-dependency-path: web_client/pnpm-lock.yaml
      - name: Install isolated Chromium test runner
        run: bash automation/ci/browser.sh
      - name: Run canonical regression DAG
        run: python3 automation/ci/run.py lane web-startup
      - name: Preserve canonical CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.job }}-${{ github.run_attempt }}
          path: ~/.cache/festapp-ci/runs
          retention-days: 7
          if-no-files-found: ignore
