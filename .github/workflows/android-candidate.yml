name: Android candidate batch

on:
  workflow_dispatch:
    inputs:
      targets_json:
        description: 'JSON array of 1-30 tenant IDs, for example ["festivalslunovrat","hvezdamorska"]'
        required: true
        type: string

      reuse_build_cache:
        description: 'Reuse shared Gradle and native compilation artifacts across tenants'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-candidate-batch
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      cache_writer: ${{ steps.plan.outputs.cache_writer }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: plan
        env:
          TARGETS_JSON: ${{ inputs.targets_json }}
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/android-targets.json"
          printf '%s' "$TARGETS_JSON" > "$input"
          matrix="$(node automation/release/android_ci_plan.mjs candidate "$input")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "cache_writer=$(jq -r ' .include[0].tenant ' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  warm-gradle-cache:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Shared build cache disabled
        if: ${{ !inputs.reuse_build_cache }}
        run: echo 'Shared build caches disabled; tenant build will run cold.'
      - uses: actions/checkout@v7
        if: inputs.reuse_build_cache
      - uses: actions/setup-java@v6
        if: inputs.reuse_build_cache
        with:
          distribution: temurin
          java-version: '17'
      - id: flutter-version
        if: inputs.reuse_build_cache
        run: echo "version=$(node automation/flutter_version.mjs)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: inputs.reuse_build_cache
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - name: Populate the shared Gradle dependency cache
        if: inputs.reuse_build_cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: external
      - id: warm-cache-keys
        continue-on-error: true
        if: inputs.reuse_build_cache
        env:
          FESTAPP_CACHE_RUSTC_VERSION: not-built
        run: node automation/release/android_build_cache.mjs >> "$GITHUB_OUTPUT"
      - name: Restore shared Gradle build state
        id: warm-cache
        if: ${{ inputs.reuse_build_cache && steps.warm-cache-keys.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.warm-cache-keys.outputs.gradle }}-${{ github.run_id }}-warm
          restore-keys: ${{ steps.warm-cache-keys.outputs.gradle }}-
      - shell: bash
        if: inputs.reuse_build_cache
        run: |
          set -euo pipefail
          node automation/configure_fonts.js . --assets-only
          flutter pub get --enforce-lockfile
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          (cd android && ./gradlew dependencies --no-daemon --build-cache)
      - name: Save shared Gradle warm state
        if: ${{ always() && inputs.reuse_build_cache && steps.warm-cache-keys.outcome == 'success' && steps.warm-cache.outputs.cache-matched-key == '' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.warm-cache-keys.outputs.gradle }}-${{ github.run_id }}-warm
  build:
    needs: [plan, warm-gradle-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: android-build-${{ matrix.tenant }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Preserve trusted release tooling outside the source checkout
        shell: bash
        run: |
          set -euo pipefail
          cp automation/release/verify_android_aab.mjs "$RUNNER_TEMP/verify_android_aab.mjs"
          cp automation/release/project_version.mjs "$RUNNER_TEMP/project_version.mjs"
          cp automation/release/android_build_cache.mjs "$RUNNER_TEMP/android_build_cache.mjs"
          cp android/gradlew "$RUNNER_TEMP/gradlew"
          cp android/gradle/wrapper/gradle-wrapper.jar "$RUNNER_TEMP/gradle-wrapper.jar"
      - name: Check out immutable tenant source
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sourceSha }}
          fetch-depth: 0
          clean: true
      - name: Install the main-owned Gradle wrapper from trusted main
        shell: bash
        run: |
          install -m 0755 "$RUNNER_TEMP/gradlew" android/gradlew
          install -m 0644 "$RUNNER_TEMP/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Prove source is still the current production branch head
        env:
          BRANCH: ${{ matrix.branch }}
          SOURCE_SHA: ${{ matrix.sourceSha }}
          TENANT: ${{ matrix.tenant }}
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$SOURCE_SHA"
          base_main_sha="$(jq -r '.baseMainSha' automation/tenant-overlay.json)"
          test "$TENANT" = "$(jq -r '.tenantId' automation/tenant-overlay.json)"
          git fetch --no-tags origin main
          git show "$base_main_sha:automation/check_tenant_branch_drift.sh" > "$RUNNER_TEMP/check_tenant_branch_drift.sh"
          CANONICAL_MAIN_REF=origin/main bash "$RUNNER_TEMP/check_tenant_branch_drift.sh" \
            "$base_main_sha" "$TENANT" "$SOURCE_SHA"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - id: flutter-version
        run: echo "version=$(node automation/flutter_version.mjs)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - name: Restore and update the tenant Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: external
      - name: Compute shared build cache keys
        id: build-cache-keys
        continue-on-error: true
        if: inputs.reuse_build_cache
        shell: bash
        run: |
          set -euo pipefail
          if ! rustup run stable rustc --version >/dev/null 2>&1; then
            rustup toolchain install stable --profile minimal
          fi
          export FESTAPP_CACHE_RUSTC_VERSION="$(rustup run stable rustc -vV)"
          printf 'RUSTC=%s\n' "$(rustup which --toolchain stable rustc)" >> "$GITHUB_ENV"
          printf 'RUSTDOC=%s\n' "$(rustup which --toolchain stable rustdoc)" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/android_build_cache.mjs" >> "$GITHUB_OUTPUT"
      - name: Restore shared Gradle compilation state
        id: gradle-cache
        if: ${{ inputs.reuse_build_cache && steps.build-cache-keys.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.build-cache-keys.outputs.gradle }}-${{ github.run_id }}-${{ matrix.tenant }}
          restore-keys: ${{ steps.build-cache-keys.outputs.gradle }}-
      - name: Restore shared native compilation artifacts
        id: native-cache
        if: ${{ inputs.reuse_build_cache && steps.build-cache-keys.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            build/super_native_extensions/build
            build/irondash_engine_context/build
            ~/.cargo/registry
          key: ${{ steps.build-cache-keys.outputs.native }}-${{ github.run_id }}-${{ matrix.tenant }}
          restore-keys: ${{ steps.build-cache-keys.outputs.native }}-
      - name: Materialize private tenant and signing inputs
        env:
          RELEASE_MANIFEST_JSON: ${{ secrets.RELEASE_MANIFEST_JSON }}
          UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$RELEASE_MANIFEST_JSON"
          test -n "$UPLOAD_KEYSTORE_B64"
          test -n "$KEY_PROPERTIES"
          printf '%s' "$RELEASE_MANIFEST_JSON" > "$RUNNER_TEMP/release-manifest.json"
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/android-upload.keystore"
          printf '%s\n' "$KEY_PROPERTIES" | sed '/^[[:space:]]*storeFile[[:space:]]*=/d' > android/key.properties
          printf 'storeFile=%s\n' "$RUNNER_TEMP/android-upload.keystore" >> android/key.properties
          jq -e --arg branch '${{ matrix.branch }}' \
            '.schemaVersion == 2 and .releaseBranch == $branch and (.androidPackage | type == "string")' \
            "$RUNNER_TEMP/release-manifest.json" >/dev/null
          set -a
          source automation/project.conf
          set +a
          test "$ANDROID_APPLICATION_ID" = "$(jq -r '.androidPackage' "$RUNNER_TEMP/release-manifest.json")"
          FESTAPP_RELEASE_MANIFEST="$RUNNER_TEMP/release-manifest.json" \
            node automation/release/client_cutover_preflight.mjs --require-canonical-cutover
      - name: Build signed Android App Bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "${GITHUB_ACTIONS:-}" = true
          node automation/configure_fonts.js . --assets-only
          flutter pub get --enforce-lockfile
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          (cd android && ./gradlew checkReleaseAarMetadata --no-daemon --build-cache)
          version_json="$(node automation/release/project_version.mjs --json)"
          flutter build appbundle --release --build-name "$(jq -r .version <<<"$version_json")" \
            --build-number "$(jq -r .build <<<"$version_json")"
      - name: Inspect reusable native outputs
        id: native-cache-state
        if: ${{ always() && inputs.reuse_build_cache && steps.build-cache-keys.outcome == 'success' }}
        shell: bash
        run: |
          if [ -d build/super_native_extensions/build ] || [ -d build/irondash_engine_context/build ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Save shared native compilation artifacts
        if: ${{ success() && inputs.reuse_build_cache && matrix.tenant == needs.plan.outputs.cache_writer && steps.native-cache-state.outputs.available == 'true' && steps.native-cache.outputs.cache-matched-key == '' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            build/super_native_extensions/build
            build/irondash_engine_context/build
            ~/.cargo/registry
          key: ${{ steps.build-cache-keys.outputs.native }}-${{ github.run_id }}-${{ matrix.tenant }}
      - name: Save shared Gradle compilation state
        if: ${{ always() && inputs.reuse_build_cache && matrix.tenant == needs.plan.outputs.cache_writer && steps.build-cache-keys.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.build-cache-keys.outputs.gradle }}-${{ github.run_id }}-${{ matrix.tenant }}
      - name: Report build cache reuse
        if: always()
        env:
          REUSE_ENABLED: ${{ inputs.reuse_build_cache }}
          GRADLE_MATCH: ${{ steps.gradle-cache.outputs.cache-matched-key }}
          NATIVE_MATCH: ${{ steps.native-cache.outputs.cache-matched-key }}
        run: |
          printf '### Shared build cache\nEnabled: %s\n\nGradle restored: `%s`\n\nNative restored: `%s`\n' \
            "$REUSE_ENABLED" "${GRADLE_MATCH:-miss}" "${NATIVE_MATCH:-miss}" >> "$GITHUB_STEP_SUMMARY"
      - name: Encrypt the raw build output for validation recovery
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ANDROID_ARTIFACT_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_PASSPHRASE"
          mkdir -p "$RUNNER_TEMP/raw"
          printf '%s' "$ARTIFACT_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "$RUNNER_TEMP/raw/app-release.aab.gpg" \
            build/app/outputs/bundle/release/app-release.aab
      - name: Store the encrypted raw build output
        uses: actions/upload-artifact@v7
        with:
          name: android-raw-${{ matrix.tenant }}-${{ matrix.sourceSha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/raw/app-release.aab.gpg
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Install pinned Bundletool verifier
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar \
            -o "$RUNNER_TEMP/bundletool.jar"
          echo '675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c  '${RUNNER_TEMP}'/bundletool.jar' | sha256sum --check
      - id: verify
        name: Independently verify package, version, signer and personal-data boundary
        env:
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
          EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
          TOOLING_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          receipt="$RUNNER_TEMP/release-receipt.json"
          result="$(node "$RUNNER_TEMP/verify_android_aab.mjs" "$aab" \
            "$RUNNER_TEMP/release-manifest.json" '${{ matrix.sourceSha }}' "$receipt")"
          echo "package=$(jq -r .packageName <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "version_code=$(jq -r .versionCode <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "artifact_sha=$(jq -r .artifactSha256 <<<"$result")" >> "$GITHUB_OUTPUT"
      - name: Stage the verified candidate artifact
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ANDROID_ARTIFACT_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_PASSPHRASE"
          mkdir -p "$RUNNER_TEMP/candidate-plain" "$RUNNER_TEMP/candidate"
          cp build/app/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/candidate-plain/app-release.aab"
          cp "$RUNNER_TEMP/release-receipt.json" "$RUNNER_TEMP/candidate-plain/release-receipt.json"
          tar -C "$RUNNER_TEMP/candidate-plain" -cf "$RUNNER_TEMP/candidate.tar" .
          printf '%s' "$ARTIFACT_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "$RUNNER_TEMP/candidate/android-candidate.tar.gpg" "$RUNNER_TEMP/candidate.tar"
      - name: Store the candidate as a private GitHub artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-candidate-${{ matrix.tenant }}-${{ matrix.sourceSha }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          compression-level: 0
          # Candidates are a short promotion window; rebuild after expiry.
          retention-days: 7
      - name: Record immutable candidate identity
        shell: bash
        run: |
          {
            echo "### Android candidate"
            echo "- Candidate retention: 7 days; rebuild after expiry."
            echo "- Candidate run ID: \`${{ github.run_id }}\`"
            echo "- Tooling: \`${{ github.sha }}\`"
            echo "- Artifact: \`android-candidate-${{ matrix.tenant }}-${{ matrix.sourceSha }}\`"
            echo "- Package: \`${{ steps.verify.outputs.package }}\`"
            echo "- Version code: \`${{ steps.verify.outputs.version_code }}\`"
            echo "- Source: \`${{ matrix.sourceSha }}\`"
            echo "- AAB SHA-256: \`${{ steps.verify.outputs.artifact_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private inputs
        if: always()
        shell: bash
        run: |
          find "$RUNNER_TEMP" -maxdepth 1 -type f \( -name '*keystore*' -o -name '*manifest*' \) -delete
          find android -maxdepth 1 -type f -name 'key.properties' -delete
