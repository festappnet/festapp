name: Android production batch

on:
  workflow_dispatch:
    inputs:
      releases_json:
        description: 'Approved JSON array containing tenant, packageName, versionCode, sourceSha, artifactSha256 and action=production-completed'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-production-batch
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - id: plan
        env:
          RELEASES_JSON: ${{ inputs.releases_json }}
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/android-releases.json"
          printf '%s' "$RELEASES_JSON" > "$input"
          matrix="$(node automation/release/android_ci_plan.mjs production "$input")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-production-${{ matrix.tenant }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Preserve trusted verification tooling
        shell: bash
        run: |
          cp automation/release/verify_android_aab.mjs "$RUNNER_TEMP/verify_android_aab.mjs"
          cp automation/release/play_track_readback.rb "$RUNNER_TEMP/play_track_readback.rb"
      - name: Check out authorized source
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sourceSha }}
          fetch-depth: 1
          clean: true
      - name: Prove the authorized source is still current
        env:
          BRANCH: ${{ matrix.branch }}
          SOURCE_SHA: ${{ matrix.sourceSha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$SOURCE_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Materialize private publishing inputs
        env:
          RELEASE_MANIFEST_JSON: ${{ secrets.RELEASE_MANIFEST_JSON }}
          GOOGLE_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$RELEASE_MANIFEST_JSON"
          test -n "$GOOGLE_PLAY_JSON"
          printf '%s' "$RELEASE_MANIFEST_JSON" > "$RUNNER_TEMP/release-manifest.json"
          printf '%s' "$GOOGLE_PLAY_JSON" > "$RUNNER_TEMP/google-play.json"
          jq -e --arg package '${{ matrix.packageName }}' --arg branch '${{ matrix.branch }}' \
            '.schemaVersion == 2 and .androidPackage == $package and .releaseBranch == $branch' \
            "$RUNNER_TEMP/release-manifest.json" >/dev/null
      - name: Download the exact authorized candidate from private R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.FESTAPP_ANDROID_RELEASE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BUCKET"
          prefix="android/releases/${{ matrix.packageName }}/${{ matrix.versionCode }}/${{ matrix.sourceSha }}/${{ matrix.artifactSha256 }}"
          npx --yes wrangler@4.129.1 r2 object get "$BUCKET/$prefix.aab" --file "$RUNNER_TEMP/release.aab" --remote
          npx --yes wrangler@4.129.1 r2 object get "$BUCKET/$prefix.receipt.json" --file "$RUNNER_TEMP/stored-receipt.json" --remote
          jq -e \
            --arg package '${{ matrix.packageName }}' \
            --argjson version '${{ matrix.versionCode }}' \
            --arg source '${{ matrix.sourceSha }}' \
            --arg hash '${{ matrix.artifactSha256 }}' \
            '.packageName == $package and .versionCode == $version and .sourceSha == $source and .artifactSha256 == $hash' \
            "$RUNNER_TEMP/stored-receipt.json" >/dev/null
          echo '${{ matrix.artifactSha256 }}  '${RUNNER_TEMP}'/release.aab' | sha256sum --check
      - name: Install pinned Bundletool verifier
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar \
            -o "$RUNNER_TEMP/bundletool.jar"
          echo '675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c  '${RUNNER_TEMP}'/bundletool.jar' | sha256sum --check
      - name: Reverify the exact production input
        env:
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
          EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/verify_android_aab.mjs" "$RUNNER_TEMP/release.aab" \
            "$RUNNER_TEMP/release-manifest.json" '${{ matrix.sourceSha }}' "$RUNNER_TEMP/reverified-receipt.json" >/dev/null
          cmp "$RUNNER_TEMP/stored-receipt.json" "$RUNNER_TEMP/reverified-receipt.json"
      - name: Install pinned Play publishing tooling
        working-directory: automation/release/fastlane
        shell: bash
        run: |
          set -euo pipefail
          bundle config set --local path "$RUNNER_TEMP/bundle"
          bundle install --jobs 4 --retry 3
      - name: Publish the authorized AAB to full production
        env:
          FESTAPP_RELEASE_MANIFEST: ${{ runner.temp }}/release-manifest.json
          GOOGLE_PLAY_JSON_KEY: ${{ runner.temp }}/google-play.json
          PLAY_AAB_PATH: ${{ runner.temp }}/release.aab
          PLAY_TARGET_TRACK: production
          PLAY_CONFIRMATION: ${{ matrix.packageName }}|${{ matrix.versionCode }}|${{ matrix.sourceSha }}|production
        working-directory: automation/release/fastlane
        shell: bash
        run: bundle exec fastlane android play_production
      - name: Read production state back from Google Play
        env:
          PLAY_PACKAGE: ${{ matrix.packageName }}
          PLAY_EXPECTED_VERSION_CODE: ${{ matrix.versionCode }}
          GOOGLE_PLAY_JSON_KEY: ${{ runner.temp }}/google-play.json
        working-directory: automation/release/fastlane
        shell: bash
        run: bundle exec ruby "$RUNNER_TEMP/play_track_readback.rb"
      - name: Remove private inputs
        if: always()
        shell: bash
        run: |
          find "$RUNNER_TEMP" -maxdepth 1 -type f \( \
            -name 'release-manifest.json' -o \
            -name 'google-play.json' -o \
            -name 'stored-receipt.json' -o \
            -name 'reverified-receipt.json' -o \
            -name 'release.aab' \
          \) -delete
