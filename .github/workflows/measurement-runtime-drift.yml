name: Measurement runtime drift
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Job name is listed in automation/ci/release_gate.py INFORMATIONAL_CHECKS.
  measurement-runtime-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - run: node automation/verify_measurement_runtimes.mjs
