name: Navigation interaction regressions
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/app_router.dart'
      - 'lib/router_service.dart'
      - 'lib/app_config.dart'
      - 'lib/components/_shared/app_panel_helper.dart'
      - 'lib/components/navigation/**'
      - 'lib/components/occasion/db_occasions.dart'
      - 'lib/components/occasion/occasion_creation_helper.dart'
      - 'lib/components/occasion/occasion_creation_notice.dart'
      - 'lib/components/unit/**'
      - 'lib/router_service.dart'
      - 'test/components/occasion/occasion_list_refresh_test.dart'
      - 'test/components/unit/**'
      - 'lib/components/schedule/**'
      - 'lib/components/timeline/**'
      - 'test/components/navigation/**'
      - 'automation/testing/navigation_default.dart'
      - 'test/support/register_client_suites.dart'
      - 'test/components/users/profile_commands_cases.dart'
      - 'test/components/users/occasion_user_grid_cases.dart'
      - 'test/components/single_data_grid/**'
      - 'test/components/schedule/**'
      - 'test/components/breadcrumb_row_cases.dart'
      - 'test/support/navigation_fixture.dart'
      - 'automation/ci/**'
      - '.github/workflows/navigation-interactions.yml'
  push:
    branches: [main]
    paths:
      - 'lib/app_router.dart'
      - 'lib/router_service.dart'
      - 'lib/app_config.dart'
      - 'lib/components/_shared/app_panel_helper.dart'
      - 'lib/components/navigation/**'
      - 'lib/components/occasion/db_occasions.dart'
      - 'lib/components/occasion/occasion_creation_helper.dart'
      - 'lib/components/occasion/occasion_creation_notice.dart'
      - 'lib/components/unit/**'
      - 'lib/router_service.dart'
      - 'test/components/occasion/occasion_list_refresh_test.dart'
      - 'test/components/unit/**'
      - 'lib/components/schedule/**'
      - 'lib/components/timeline/**'
      - 'test/components/navigation/**'
      - 'automation/testing/navigation_default.dart'
      - 'test/support/register_client_suites.dart'
      - 'test/components/users/profile_commands_cases.dart'
      - 'test/components/users/occasion_user_grid_cases.dart'
      - 'test/components/single_data_grid/**'
      - 'automation/ci/**'
      - '.github/workflows/navigation-interactions.yml'
permissions:
  contents: read
jobs:
  navigation-interactions:
    runs-on: ubuntu-latest
    env:
      FVM_CACHE_PATH: /tmp/festapp-fvm
    steps:
      - uses: actions/checkout@v7
      - id: sdk
        run: echo "version=$(sed -n 's/^FLUTTER_VERSION=//p' automation/project.conf)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - name: Use the installed SDK through FVM
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          mkdir -p "$FVM_CACHE_PATH/versions"
          ln -s "$FLUTTER_ROOT" "$FVM_CACHE_PATH/versions/${{ steps.sdk.outputs.version }}"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
      - name: Run canonical regression DAG
        run: python3 automation/ci/run.py lane navigation-interactions
      - name: Preserve canonical CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.job }}-${{ github.run_attempt }}
          path: ~/.cache/festapp-ci/runs
          retention-days: 7
          if-no-files-found: ignore
