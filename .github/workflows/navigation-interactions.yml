name: Navigation interaction regressions
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: read
jobs:
  navigation-interactions:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      FVM_CACHE_PATH: /tmp/festapp-fvm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select verified CI inputs
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/ci/selection.py navigation-interactions
      - id: sdk
        if: steps.selection.outputs.run == 'true'
        run: echo "version=$(sed -n 's/^FLUTTER_VERSION=//p' automation/project.conf)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: steps.selection.outputs.run == 'true'
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - name: Use the installed SDK through FVM
        if: steps.selection.outputs.run == 'true'
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          mkdir -p "$FVM_CACHE_PATH/versions"
          ln -s "$FLUTTER_ROOT" "$FVM_CACHE_PATH/versions/${{ steps.sdk.outputs.version }}"
      - uses: pnpm/action-setup@v6
        if: steps.selection.outputs.run == 'true'
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        if: steps.selection.outputs.run == 'true'
        with:
          node-version: '22.23.3'
      - name: Run canonical regression DAG
        if: steps.selection.outputs.run == 'true'
        run: python3 automation/ci/run.py lane navigation-interactions
      - name: All lane tests executed
        if: steps.selection.outputs.run == 'true'
        run: echo 'All lane tests executed'
      - name: Preserve canonical CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.job }}-${{ github.run_attempt }}
          path: ~/.cache/festapp-ci/runs
          retention-days: 7
          if-no-files-found: ignore
