name: Restore pinned browser dependencies
description: Reuse pinned Chromium binaries across compatible host jobs.
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: |
        set -euo pipefail
        version="$(node -p "require('./web_client/package.json').devDependencies.playwright")"
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
        printf 'browsers=cms-browsers-%s-%s-%s-playwright-%s-chromium\n' \
          "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:?}" "$version" >> "$GITHUB_OUTPUT"
    - name: Restore Playwright browser binaries
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.key.outputs.browsers }}
