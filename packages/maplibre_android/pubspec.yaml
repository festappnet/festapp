name: maplibre_android
description: "Android implementation of the Flutter MapLibre plugin."
version: 0.3.6
repository: https://github.com/josxha/flutter-maplibre
issue_tracker: https://github.com/josxha/flutter-maplibre/issues
homepage: https://flutter-maplibre.pages.dev
documentation: https://flutter-maplibre.pages.dev/docs/

platforms: { android: }

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  ffi: ^2.1.3
  flutter: { sdk: flutter }
  jni: ^1.0.0
  jni_flutter: ^1.0.0
  maplibre_platform_interface: ^0.3.6

dev_dependencies:
  flutter_test: { sdk: flutter }
  jnigen: 0.17.0
  very_good_analysis: ^10.0.0

dependency_overrides:
  maplibre_platform_interface:
    path: ../maplibre_platform_interface

flutter:
  plugin:
    implements: maplibre
    platforms:
      android:
        package: com.github.josxha.maplibre
        pluginClass: MapLibrePlugin
        dartPluginClass: MapLibrePlugin
        dartFileName: 'src/maplibre_plugin.dart'
