<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Smazání účtu | Festapp</title>
  <style>body{margin:0;background:#f6f7fb;color:#15182d;font:17px/1.55 system-ui,sans-serif}main{max-width:620px;margin:auto;padding:52px 22px}.card{background:white;border-radius:18px;padding:28px;box-shadow:0 8px 35px #19204018}button{border:0;border-radius:10px;padding:14px 18px;font:700 16px system-ui;cursor:pointer;background:#b42318;color:#fff}button:disabled{opacity:.55}a{color:#0000b8}.muted{color:#5a6178}</style>
</head>
<body><main><div class="card"><h1>Smazání účtu</h1><p id="status" role="status">Ověřuji jednorázový odkaz…</p><div id="action" hidden><p>Smazáním ztratíte přístup k účtu, účasti, uloženému programu a soukromým údajům. Zákonem vyžadované záznamy mohou zůstat pouze bez přímé identity.</p><p><strong>Pouhé otevření této stránky účet nemaže.</strong></p><button id="confirm" type="button">Trvale smazat účet</button></div><p class="muted"><a href="/privacy/choices">Jak smazání funguje</a></p></div></main>
<script type="module">
const status = document.querySelector('#status');
const action = document.querySelector('#action');
const button = document.querySelector('#confirm');
const token = new URLSearchParams(location.search).get('token') || '';
const endpoint = "https://kjdpmixlnhntmxjedpxh.supabase.co/functions/v1/confirm-account-deletion";
const apiKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZHBtaXhsbmhudG14amVkcHhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDE5NDI5NzEsImV4cCI6MjAxNzUxODk3MX0.06nTXCL-i1GxLckfEyCNlVVwt62QTzKUezqmsYSR_MI";
async function inspect() {
  if (!token) { status.textContent = 'Odkaz není platný.'; return; }
  try {
    const response = await fetch(`${endpoint}?token=${encodeURIComponent(token)}`, {method:'GET', headers:{apikey:apiKey}});
    const body = await response.json().catch(() => ({}));
    if (!response.ok || body.status !== 'valid') { status.textContent = response.status === 410 ? 'Platnost odkazu vypršela.' : 'Odkaz není platný nebo už byl použit.'; return; }
    status.textContent = `Odkaz je platný do ${new Date(body.expiresAt).toLocaleString('cs-CZ')}.`;
    action.hidden = false;
  } catch { status.textContent = 'Ověření se nezdařilo. Zkuste to později.'; }
}
button.addEventListener('click', async () => {
  if (!confirm('Opravdu chcete nevratně smazat celý účet?')) return;
  button.disabled = true; status.textContent = 'Smazání se zpracovává…';
  try {
    const response = await fetch(endpoint, {method:'POST', headers:{'content-type':'application/json',apikey:apiKey}, body:JSON.stringify({token})});
    const body = await response.json().catch(() => ({}));
    if (response.ok && ['completed','already_completed','processing'].includes(body.status)) { action.hidden = true; status.textContent = body.status === 'processing' ? 'Smazání probíhá. Tuto stránku můžete později znovu načíst.' : 'Účet byl smazán.'; return; }
    status.textContent = response.status === 410 ? 'Platnost odkazu vypršela.' : 'Smazání se nezdařilo. Zkuste to později.';
  } catch { status.textContent = 'Smazání se nezdařilo. Zkuste to později.'; }
  button.disabled = false;
});
inspect();
</script></body></html>
