[build]

  publish = "build/web"
  command = "./automation/ci_build.sh"

# The Netlify hostname remains only as a compatibility boundary. Preserve the
# old worker endpoints long enough to retire cached shells, then redirect every
# application URL to the canonical hostname with its path and query intact.
# Farnost Opava is a web-only tenant and does not own a OneSignal application.
[[redirects]]
  from = "https://farnostopava.netlify.app/festapp_service_worker.js"
  to = "/netlify-retire-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "https://farnostopava.netlify.app/flutter_service_worker.js"
  to = "/netlify-retire-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "https://farnostopava.netlify.app/push/*"
  to = "/netlify-retire-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "https://farnostopava.netlify.app/*"
  to = "https://rezervace.farnostopava.cz/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
