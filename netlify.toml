[build]

  publish = "build/web"
  command = "./automation/ci_build.sh"

# The Netlify hostname remains only as a compatibility boundary. Preserve the
# old worker endpoints long enough to retire cached shells and any historical
# origin-bound push worker, then redirect every application URL to the
# canonical Festapp hostname with its path and query intact. Jubilee itself
# does not own a OneSignal application.
[[redirects]]
  from = "https://jubileum2025.netlify.app/festapp_service_worker.js"
  to = "/netlify-retire-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "https://jubileum2025.netlify.app/flutter_service_worker.js"
  to = "/netlify-retire-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "https://jubileum2025.netlify.app/push/*"
  to = "/netlify-retire-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "https://jubileum2025.netlify.app/*"
  to = "https://jubileum2025.festapp.net/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
