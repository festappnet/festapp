[build]
  publish = "build/web"
  command = "./automation/ci_build.sh"

# Retire cached legacy shells, then preserve path and query on Cloudflare.
[[redirects]]
  from = "https://aksmcz.netlify.app/festapp_service_worker.js"
  to = "/netlify-retire-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "https://aksmcz.netlify.app/flutter_service_worker.js"
  to = "/netlify-retire-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "https://aksmcz.netlify.app/push/*"
  to = "/netlify-retire-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "https://aksmcz.netlify.app/*"
  to = "https://csa2024.festapp.net/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
