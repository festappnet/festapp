[build]

  publish = "build/web"
  command = "./automation/ci_build.sh"

# Keep vstupenky.online as the application origin. The generated Netlify
# hostname is only a legacy compatibility boundary and must never serve an
# independently cached application shell.
[[redirects]]
  from = "https://vstupenkyonline.netlify.app/"
  to = "https://vstupenky.online/"
  status = 301
  force = true

[[redirects]]
  from = "https://vstupenkyonline.netlify.app/festapp_service_worker.js"
  to = "/netlify-retire-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "https://vstupenkyonline.netlify.app/flutter_service_worker.js"
  to = "/netlify-retire-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "https://vstupenkyonline.netlify.app/push/*"
  to = "/push/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://vstupenkyonline.netlify.app/*"
  to = "https://vstupenky.online/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Edge Functions are auto-discovered from netlify/edge-functions
# but we can explicitly register if needed, or just rely on the export config in the file.
# The JS file exports config = { path: "/form/*" } so explicit toml entry is optional but good for visibility.

[[edge_functions]]
  path = "/form/*"
  function = "inject-og"

[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"
