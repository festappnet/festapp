:root {
    /* Colors from properties matches Flutter ThemeConfig */
    --seed-1: #253759;
    --seed-2: #80BDF2; /* dddPrimary */
    --seed-3: #4465A6; /* lllPrimary */
    --white: #ffffff;

    /* Light Theme (Default) */
    --primary-color: var(--seed-3);
    --accent-color: var(--seed-2);
    --background-color: #ebf1f6; /* lllBackground: seed2 sat 0.10 light 0.92 */
    --surface-color: #ffffff;
    --text-color: #000000;
    --card-bg: #ffffff;
    --red-color: #d32f2f;

    /* Dimensions */
    --header-height: 80px;
    --max-width: 1200px;
    --form-max-width: 580px; /* Reduced to match formMaxWidthMid from StylesConfig */

    /* Spacing */
    --spacing-sm: 8px;
    --spacing-md: 16px;
    --spacing-lg: 24px;

    /* Border Radius */
    --radius-sm: 10px;
    --radius-md: 15px;
    --radius-round: 50%;

    /* Font Scale (Default for Futura) */
    --font-scale: 1.2;
}

body.dark-mode {
    --primary-color: var(--seed-2); /* Use lighter blue for better contrast on dark */
    --background-color: #232529; /* dddBackground: seed3 sat 0.08 light 0.14 */
    --surface-color: #2b2d31; /* sat 0.06 light 0.20 */
    --text-color: #bdbdbd; /* Neutral White, was #cedcea (blueish) */
    --card-bg: #2b2d31; /* Fix for card background in dark mode */
    --red-color: #ff5252;
    --bg-input: var(--card-bg); /* FIXED: matched var name used in input rule */
    /* Enhance Contrast for Outlines (Subtle) */
    --input-border: rgba(255, 255, 255, 0.2);
    --unselected-widget-border: rgba(255, 255, 255, 0.2);
}

body {
    font-family: 'Futura', sans-serif; /* Default font from Flutter */
    margin: 0;
    background-color: var(--background-color);
    color: var(--text-color);
    overflow-y: scroll;
    min-height: 100vh;
}

a {
    color: var(--link-color, var(--primary-color));
    text-decoration: none;
}
a:hover {
    text-decoration: underline;
}

#app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

main {
    flex: 1;
    width: 100%;
    max-width: var(--max-width);
    margin: 0 auto;
    padding: var(--spacing-lg) var(--spacing-md);
    box-sizing: border-box;
}

/* Loader */
#flutter-loader {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--white);
    z-index: 9999;
    align-items: center;
    justify-content: center;
}
.sp-loader {
    height: 50px; width: 50px;
    border: 4px solid #0000;
    border-radius: 50%;
    border-color: #ccc #0000;
    animation: l16 1s infinite linear;
}
.sp-loader::before {
    content: "";
    position: absolute; inset: 0;
    margin: 2px;
    border: inherit;
    border-radius: 50%;
    border-color: var(--primary-color) #0000;
    animation: inherit;
    animation-duration: .5s;
    animation-direction: reverse;
}
@keyframes l16 { 100%{transform: rotate(1turn)} }

/* Search Container Global Style */
.search-container {
    max-width: var(--form-max-width);
    margin: var(--spacing-md) auto 32px;
    position: relative;
}
.search-input {
    width: 100%;
    padding: 12px 16px 12px 48px;
    border-radius: var(--radius-sm);
    border: 1px solid #ddd;
    font-size: 16px;
    box-sizing: border-box;
    outline: none;
    background-color: var(--bg-input, #fff); /* Ensure explicit background */
    color: var(--text-color, #333);
}
.search-input:focus {
    border-color: var(--accent-color);
    border-width: 2px;
    padding: 11px 15px 11px 47px;
}
.search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #999;
    pointer-events: none;
}
.clear-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #999;
    cursor: pointer;
    display: none;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}
::-webkit-scrollbar-track {
    background: transparent;
}
::-webkit-scrollbar-thumb {
    background-color: rgba(0, 0, 0, 0.2);
    border-radius: var(--radius-sm);
}
::-webkit-scrollbar-thumb:hover {
    background-color: rgba(0, 0, 0, 0.4);
}
/* Dark mode adjust */
body.dark-mode ::-webkit-scrollbar-thumb {
    background-color: rgba(255, 255, 255, 0.2);
}
body.dark-mode ::-webkit-scrollbar-thumb:hover {
    background-color: rgba(255, 255, 255, 0.4);
}
/* Image Smooth Loading */
img.smooth-load {
    opacity: 0;
    transition: opacity 0.5s ease-out;
}
img.smooth-load.loaded {
    opacity: 1;
}

.auth-container { gap: 16px; padding: 24px; }
.auth-container button { min-height:44px; }

.auth-container .toggle-password { min-width:44px; right:0; }
.auth-container h2 { margin: 8px 24px 0; line-height: 1.3; }
.auth-container .auth-subtitle { margin: 0; line-height: 1.5; }
.auth-container .google-button { width: 100%; min-height: 44px; border: 1px solid #747775; border-radius: 6px; background: #fff; color: #1f1f1f; display: flex; justify-content: center; align-items: center; gap: 12px; font: 500 14px var(--font-family, sans-serif); cursor: pointer; padding: 12px 16px; }

.auth-container .google-button:hover { box-shadow: 0 1px 3px #0003; }
.auth-container .google-button:disabled { opacity: .65; cursor: wait; }

.auth-container .auth-consent { display:flex; align-items:flex-start; gap: 8px; margin: 16px 0; line-height: 1.4; font-size: 13px; }

.auth-container .google-profile-actions { display: flex; flex-direction: column; gap: 12px; }
.auth-container .form-row > * { min-width: 0; }
@media(max-width:390px) { .auth-container { padding: 20px; } .auth-container .form-row { flex-direction: column; gap: 0; } }

.auth-container {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    font-family: var(--font-family, sans-serif);
    position: relative; /* For close button absolute pos */
}

.modal-close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    color: var(--text-color, #333);
    opacity: 0.5;
    cursor: pointer;
    font-size: 24px;
    z-index: 10;
}
.modal-close-btn:hover {
    opacity: 1;
}
body.dark-mode .modal-close-btn {
    color: var(--text-color-dark, white);
}

.auth-container h2 {
    margin-bottom: 24px;
    text-align: center;
    color: var(--text-color, #1a1a1a);
}

.auth-container p {
    margin-bottom: 16px;
    color: var(--text-secondary, #666);
    text-align: center;
}

.form-group {
    margin-bottom: 16px;
}

.form-row {
    display: flex;
    gap: 16px;
}

.form-row .form-group {
    flex: 1;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: var(--text-color, #333);
}

input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border-color, #ddd);
    border-radius: 6px;
    font-size: 16px;
    transition: border-color 0.2s;
    background-color: var(--bg-input, #fff);
    color: var(--text-color, #333);
    box-sizing: border-box;
}

input:focus {
    border-color: var(--primary-color, #007bff);
    outline: none;
    box-shadow: 0 0 0 2px rgba(0,123,255,0.1);
}

/* Autofill Fix */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus,
input:-webkit-autofill:active{
    -webkit-box-shadow: 0 0 0 30px var(--bg-input, #fff) inset !important;
    -webkit-text-fill-color: var(--text-color, #333) !important;
    transition: background-color 5000s ease-in-out 0s; /* Prevent background flash */
}

/* Dark Mode Autofill */
body.dark-mode input:-webkit-autofill,
body.dark-mode input:-webkit-autofill:hover,
body.dark-mode input:-webkit-autofill:focus,
body.dark-mode input:-webkit-autofill:active{
    -webkit-box-shadow: 0 0 0 30px var(--bg-input-dark, #333) inset !important;
    -webkit-text-fill-color: var(--text-color-dark, #eee) !important;
}

.btn-primary {
    width: 100%;
    padding: 12px;
    background-color: var(--primary-color, #007bff);
    color: var(--btn-text-color, white);
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background-color 0.2s;
}

.btn-primary:hover {
    background-color: var(--primary-hover, #0056b3);
}

.btn-primary:disabled {
    background-color: var(--disabled-color, #ccc);
    cursor: not-allowed;
}

.btn-secondary {
    width: 100%;
    padding: 12px;
    background-color: transparent;
    color: var(--text-color, #333);
    border: 1px solid var(--border-color, #ddd);
    border-radius: 6px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 12px;
}

.btn-secondary:hover {
    background-color: var(--bg-hover, #f5f5f5);
}

.auth-links {
    margin-top: 16px;
    display: flex;
    justify-content: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text-secondary, #666);
}

.btn-link {
    background: none;
    border: none;
    padding: 0;
    color: var(--primary-color, #007bff);
    text-decoration: none;
    cursor: pointer;
    font-size: inherit;
    font-family: inherit;
}

.btn-link:hover {
    text-decoration: underline;
}

/* Password Toggle */
.password-group .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.password-group input {
    padding-right: 40px; /* Space for icon */
}

.toggle-password {
    position: absolute;
    right: 8px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-secondary, #666);
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.toggle-password:hover {
    color: var(--text-color, #333);
}

/* Dark Mode Overrides */
/* Assuming a class 'dark-mode' on body or generic logic prefers-color-scheme if variables aren't controlled by JS */
/* Dark Mode Overrides */
/* Use class-based selector to respect js toggle */
body.dark-mode .auth-container h2,
body.dark-mode label,
body.dark-mode input,
body.dark-mode .btn-secondary,
body.dark-mode .toggle-password:hover {
    color: var(--text-color-dark, #eee);
}

body.dark-mode .auth-container p,
body.dark-mode .auth-links,
body.dark-mode .toggle-password {
    color: var(--text-secondary-dark, #aaa);
}

body.dark-mode input {
    background-color: var(--bg-input-dark, #333);
    border-color: var(--border-color-dark, #444);
}

body.dark-mode .btn-secondary {
    border-color: var(--border-color-dark, #444);
    color: var(--text-color-dark, #eee);
}

body.dark-mode .btn-secondary:hover {
    background-color: var(--bg-hover-dark, #444);
}

.auth-links span {
    color: #ccc;
}

/* Validation Styles */
.input-wrapper.invalid input,
input.invalid {
    border-color: var(--red-color, #dc3545) !important;
    border-bottom-width: 2px !important;
}

.form-field-error {
    color: var(--red-color, #dc3545);
    font-size: 13px;
    margin-top: 4px;
    display: none;
    font-weight: 500;
    text-align: left;
}

.form-field-container {
    margin-bottom: 16px;
}
/* Reduce default margin of form-group inside container if needed */
.form-field-container .form-group {
    margin-bottom: 0;
}

/* User Settings / Segmented Controls */
.settings-widget {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
}

.settings-section {
    display: flex;
    flex-direction: column;
    width: 100%;
}

.settings-label {
    font-size: 14px;
    color: inherit;
    margin-bottom: 8px;
    font-weight: 500;
}

.segmented-control {
    display: flex;
    width: 100%;
    background-color: var(--unselected-widget-fill, rgba(0,0,0,0.05));
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--input-border, rgba(0,0,0,0.1));
}

.segmented-btn {
    border: none;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s;
    min-width: 70px;
    color: inherit;
    background-color: transparent;
    border-radius: 0;
    flex: 1;
}

.segmented-btn:not(:first-child) {
    border-left: 1px solid var(--input-border, rgba(0,0,0,0.1));
}

.segmented-btn.active {
    background-color: var(--primary-color, #4465A6);
    color: #ffffff;
}

.segmented-btn:not(.active):hover {
    background-color: rgba(0,0,0,0.05);
}

.version-info {
    font-size: 11px;
    color: inherit;
    opacity: 0.7;
    text-align: center;
    margin-top: 8px;
}
