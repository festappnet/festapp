    body {
      height: 100vh;
      width: 100vw;
      margin: 0px;
    }
    .main-content {
      --festapp-loading-accent: #80BDF2;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #19243b; /* startup-surface */
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease-out;
    }

  img.initial-logo {
    display: block;
    width: calc(100vw - 48px);
    max-width: 320px;
    max-height: 120px;
    height: auto;
    object-fit: contain;
  }

  /* HTML: &lt;div class=&quot;loader&quot;&gt;&lt;/div&gt; */
  .loader {
    height: 50px;
    width: 50px;
    aspect-ratio: 1;
    display: grid;
    border: 4px solid #0000;
    border-radius: 50%;
    border-color: #ccc #0000;
    animation: l16 1s infinite linear;
  }
  .loader::before,
  .loader::after {
    content: &quot;&quot;;
    grid-area: 1/1;
    margin: 2px;
    border: inherit;
    border-radius: 50%;
  }
  .loader::before {
    border-color: var(--festapp-loading-accent) #0000;
    animation: inherit;
    animation-duration: .5s;
    animation-direction: reverse;
  }
  .loader::after {
    margin: 8px;
  }

  .ticket-loader { display: none; align-items: center; justify-content: center; gap: 16px; height: 48px; }
  .ticket-loader img { width: 48px; height: 28px; object-fit: contain; animation: ticket-welcome 1.6s cubic-bezier(.2,.7,.2,1) infinite; }
  .ticket-loader img:nth-child(2) { animation-delay: .18s; }
  .ticket-loader img:nth-child(3) { animation-delay: .36s; }
  [data-loading-style=&quot;tickets&quot;] .loader { display: none; }
  [data-loading-style=&quot;tickets&quot;] .ticket-loader { display: flex; }
  @keyframes ticket-welcome { 0%,100% { transform: translateY(5px) rotate(-7deg); opacity:.4; } 45% { transform: translateY(-5px) rotate(4deg); opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .ticket-loader img, .loader, .loader::before { animation: none; transform: none; opacity: 1; } }
  @keyframes l16 {
    100%{transform: rotate(1turn)}
  }

.topic-section-intro h2{font-size:clamp(32px,3.6vw,48px);line-height:1.14;max-width:20ch}
.topic-section-intro p{font-size:19px;line-height:1.75;max-width:47ch}
.topic-layouts{padding-block:80px 40px}
.layout-choices{display:flex;flex-wrap:wrap;gap:10px;border:0;padding:0;margin:0 0 26px;min-width:0}
.layout-choices label{cursor:pointer;position:relative}
.layout-choices input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.layout-choices span{display:block;padding:12px 20px;border:1px solid var(--line);border-radius:28px;min-height:48px;font-size:16px}
.layout-choices input:checked+span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.layout-choices input:focus-visible+span{outline:3px solid var(--accent);outline-offset:4px}
.topic-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:center;gap:52px;margin:0;padding-block:25px 40px}
.topic-layout-image{background:#e8eceb;border-radius:15px;padding:24px}
.topic-layout-image img{max-height:560px;width:100%;height:auto;object-fit:contain;margin:auto}
.topic-layout figcaption h3{font-size:29px;line-height:1.2;margin-bottom:18px}
.topic-layout figcaption p{font-size:18px;line-height:1.8}
.topic-layout figcaption&gt;a{display:inline-flex;align-items:center;min-height:44px;margin-top:18px;font-size:15px;text-decoration:underline;text-underline-offset:4px;color:var(--accent)}
.topic-demonstration{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);align-items:center;gap:65px;padding-block:75px;border-top:1px solid var(--line)}
.topic-demonstration h2{font-size:clamp(32px,3.6vw,48px);line-height:1.14;max-width:22ch}
.topic-demonstration p{font-size:19px;line-height:1.75;margin-top:24px}
.topic-demonstration .topic-text-link{margin-top:22px}
.topic-demonstration-media{min-width:0}
.topic-demonstration-reverse .topic-demonstration-copy{order:2}
.topic-demonstration-reverse .topic-demonstration-media{order:1}
.topic-demonstration-reverse{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
.topic-demonstration-reverse .media-stage{max-width:430px;margin:auto}






body.dark-mode .topic-layout-image{background:#dce1df}

@media(max-width:1050px){
 .topic-intro{gap:32px}

 .topic-faq,.topic-demonstration{gap:40px}
 .topic-layout{gap:32px}.topic-ending-inner{gap:40px}
}
@media(max-width:760px){
 .topic-crumbs{padding-top:22px;font-size:13px;gap:9px}.topic-crumbs span:before{margin-right:9px}
 .topic-intro,
 .topic-intro h1{font-size:clamp(39px,10vw,58px);line-height:1.12;max-width:17ch}
 .topic-lead{font-size:18px;line-height:1.7;margin-top:22px}
 .topic-intro .actions{margin-top:24px}

 .topic-intro-art{padding-top:4px}.topic-intro-art&gt;img{max-height:360px}


 .topic-note{padding:23px 22px}.topic-note h3{font-size:22px}
 .topic-faq{grid-template-columns:1fr;gap:28px;padding-block:45px 55px}
 .topic-faq h2{font-size:32px;max-width:22ch}.topic-faq summary{font-size:19px}
 .topic-ending-inner{grid-template-columns:1fr;padding-block:45px 50px;gap:10px}
 .topic-ending h2{font-size:38px}.topic-ending p{font-size:17px}
 .topic-ending-art{display:none}
 .topic-process ol{grid-template-columns:1fr;gap:18px}.topic-process li{gap:13px}
 .topic-layouts{padding-block:45px 22px}
 .topic-section-intro{grid-template-columns:1fr;gap:20px;margin-bottom:27px}
 .topic-section-intro h2,.topic-demonstration h2&gt;h2{font-size:33px;line-height:1.17}
 .topic-section-intro p{font-size:18px}
 .layout-choices{gap:8px}.layout-choices span{font-size:14px;padding:12px 15px}
 .topic-layout{grid-template-columns:1fr;gap:24px;padding-top:0}
 .topic-layout-image{padding:14px}.topic-layout-image img{max-height:420px}
 .topic-layout figcaption h3{font-size:26px}.topic-layout figcaption p{font-size:17px}
 .topic-demonstration,.topic-demonstration-reverse{grid-template-columns:1fr;gap:30px;padding-block:43px}
 .topic-demonstration-reverse .topic-demonstration-copy,.topic-demonstration-reverse .topic-demonstration-media{order:initial}
 .topic-demonstration p{font-size:18px}.topic-bullets{font-size:17px}


}
@media(prefers-reduced-motion:reduce){.topic-page *{scroll-behavior:auto!important}}

/* Product overview: one demonstration per task, with real output alongside. */
.product-links{display:flex;flex-wrap:wrap;gap:6px 28px;margin-top:22px}
.feature#planek h2{grid-row:1/3;line-height:1.08}
.feature#planek .product-links{grid-column:2;margin-top:18px}
.product-pair{padding-block:68px}
.product-pair .feature-copy{display:grid;grid-template-columns:1fr 1fr;column-gap:64px;align-items:start}
.product-pair .feature-copy h2{grid-column:1;grid-row:1/4;max-width:18ch;font-size:clamp(36px,4vw,54px);line-height:1.1}
.product-pair .feature-copy&gt;p:not(.eyebrow){grid-column:2;max-width:53ch;margin-top:0;font-size:19px;line-height:1.65}
.product-pair .feature-copy .feature-detail{margin-top:14px;font-size:17px!important}
.product-pair .product-links{grid-column:2}
.product-pair-media{display:grid;grid-template-columns:minmax(0,1fr) 260px;align-items:center;gap:72px;margin-top:40px}
.product-pair-media figure{min-width:0;margin:0}
.product-pair-media figcaption{margin-top:14px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.product-ticket img{width:auto;height:auto;max-height:420px;max-width:100%;margin:auto;transform:rotate(4deg)}
.product-scanner{max-width:240px;justify-self:center}
.product-scanner .media-stage{background:transparent;border:0;box-shadow:none;border-radius:0}
.product-scanner .media-stage video{aspect-ratio:1/2!important;width:100%;height:auto;object-fit:contain}
.product-pair-operations .product-pair-media{align-items:center}
@media(max-width:760px){
 .feature#planek h2{font-size:38px}
 .feature#planek .product-links{margin-top:18px}
 .product-pair{padding-block:42px}
 .product-pair .feature-copy{display:block}
 .product-pair .feature-copy h2{font-size:36px;max-width:20ch}
 .product-pair .feature-copy&gt;p:not(.eyebrow){font-size:18px;margin-top:20px}
 .product-pair .feature-copy .feature-detail{margin-top:14px}
 .product-pair-media{grid-template-columns:1fr;gap:30px;margin-top:28px}
 .product-ticket img{max-height:340px}
 .product-scanner{width:min(260px,100%);margin:auto!important}
 .product-pair-media .product-primary .media-stage{max-width:100%}
}

.media-play-action{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:24px;background:var(--chrome);color:#fff;font-size:14px;line-height:1.3;box-shadow:0 4px 12px #19243b22}
.media-play-action svg{width:15px;height:15px;fill:currentColor}
.media-surface:hover .media-play-action{background:var(--accent)}
.media-surface[aria-pressed=&quot;true&quot;] .media-play-action svg{display:none}

.brand-image{display:block;width:min(240px,38vw);height:52px;object-fit:contain;object-position:left center}
.brand-on-dark{display:none}body.dark-mode .brand-on-light{display:none}body.dark-mode .brand-on-dark{display:block}
